# Define the system of units to use internally. 
InternalUnitSystem:
  UnitMass_in_cgs:     1.98848e43    # 10^10 M_sun in grams
  UnitLength_in_cgs:   3.08567758e21 # kpc in centimeters
  UnitVelocity_in_cgs: 1e5           # km/s in centimeters per second
  UnitCurrent_in_cgs:  1             # Amperes
  UnitTemp_in_cgs:     1             # Kelvin

Scheduler:
  max_top_level_cells: 16
  cell_extra_gparts:         100         # (Optional) Number of spare gparts per top-level allocated at rebuild time for on-the-fly creation.

# Parameters governing the time integration
TimeIntegration:
  time_begin: 0.    # The starting time of the simulation (in internal units).
  time_end:   0.1   # The end time of the simulation (in internal units).
  dt_min:     1e-10 # The minimal time-step size of the simulation (in internal units).
  dt_max:     0.1  # The maximal time-step size of the simulation (in internal units).
  max_dt_RMS_factor: 0.25  # (Optional) Dimensionless factor for the maximal displacement allowed based on the RMS velocities.

# Parameters governing the snapshots
Snapshots:
  subdir:              snap  # snapshot directory
  basename:            snapshot # Common part of the name of output files
  time_first:          0.    # Time of the first output (in internal units)
  delta_time:          1e-2  # Time difference between consecutive outputs (in internal units)
  compression:         4

# Parameters governing the conserved quantities statistics
Statistics:
  delta_time:          1e-3 # Time between statistics output

# Parameters for the self-gravity scheme
Gravity:
  MAC:                           adaptive  # Choice of mulitpole acceptance criterion: 'adaptive' OR 'geometric'.
  epsilon_fmm:                   0.001     # Tolerance parameter for the adaptive multipole acceptance criterion.
  theta_cr:                      0.7       # Opening angle for the purely gemoetric criterion.
  eta:          0.025               # Constant dimensionless multiplier for time integration.
  max_physical_baryon_softening: 0.05  # Physical softening length (in internal units)
  max_physical_DM_softening: 0.05  # Physical softening length (in internal units)
  
# Parameters for the hydrodynamics scheme
SPH:  
  resolution_eta:        1.2348   # Target smoothing length in units of the mean inter-particle separation (1.2348 == 48Ngbs with the cubic spline kernel).
  CFL_condition:         0.1      # Courant-Friedrich-Levy condition for time integration.
  minimal_temperature:   10.      # Kelvin
  h_max:                 10.      # (Optional) Maximal allowed smoothing length in internal units. Defaults to FLT_MAX if unspecified.
  
# Parameters related to the initial conditions
InitialConditions:
  file_name:  ./galaxy_multi_component.hdf5     # The file to read
  periodic:   0                                 # Non-periodic BCs
  shift:    [750,750,750]                       # Centre the box

# Cooling with Grackle 2.0
GrackleCooling:
  # Core Grackle settings. Each optional key states its parser default.
  cloudy_table: CloudyData_UVB=HM2012.h5        # Cloudy table file (required)
  with_UV_background: 1                         # Metagalactic UV background on or off (required)
  redshift: 0                                   # Redshift of the UV background, -1 follows the simulation time (required)
  with_metal_cooling: 1                         # Metal cooling on or off (required)
  thermal_time_myr: 0                           # Adiabatic-cooling time in Myr after a feedback event (required)
  maximal_density_Hpcm3: -1                     # Cooling density ceiling in H atoms/cm^3, a value < 0 disables it (required)
  max_steps: 10000                              # Maximal Grackle sub-cycle iterations per particle solve (Default: 10000)
  subcycle_on_failure: 2                        # Retries of a failed solve, each halving the sub-step, in [0, 20] (Default: 2)
  cmb_temperature_floor: 1                      # Grackle's internal CMB temperature floor on or off (Default: 1)
  agora_cmb_temperature_floor: 0                # AGORA redshift-dependent CMB floor T_CMB,0 (1+z) applied by SWIFT (Default: 0)
  HydrogenFractionByMass: 0.76                  # Hydrogen mass fraction (Default: 0.76)

  # Self-shielding.
  self_shielding_method: -1                     # Continuum self-shielding: -1 GEAR, 0 none, 1 to 3 Grackle (Default: 0)
  self_shielding_threshold_atom_per_cm3: 1e10   # Density threshold in H atoms/cm^3, required with self_shielding_method -1

  # Constant heating rates.
  volumetric_heating_rates_cgs: 0               # Constant volumetric heating rate [erg/s/cm3] (Default: 0)
  specific_heating_rates_cgs: 0                 # Constant specific heating rate [erg/s/g] (Default: 0)

  # Debug.
  disable_cooling_for_debugging: 0              # Debug only: skip the per-particle cooling update, cooling_init() still runs (Default: 0)

GEARStarFormation:
  star_formation_mode: agora        # default or agora
  star_formation_efficiency: 0.01   # star formation efficiency (c_*)
  maximal_temperature_K:     1e10   # Upper limit to the temperature of a star forming particle
  density_threshold_Hpcm3:   10     # Density threshold in Hydrogen atoms/cm3
  n_stars_per_particle: 1
  min_mass_frac: 0.5

GEARPressureFloor:
  jeans_factor: 10

AGORAFeedback:
  energy_in_erg_per_CCSN: 1e51
  supernovae_efficiency: 1
  supernovae_explosion_time_myr: 5 # In Myr
  ccsne_per_solar_mass : 0.010989 # 1/91
  ejected_mass_in_solar_mass_per_CCSN : 14.8
  ejected_Fe_mass_in_solar_mass_per_CCSN : 2.63
  ejected_metal_mass_in_solar_mass_per_CCSN : 2.63

AGORAChemistry:
  initial_metallicity: 1          # if less than 0, read the metallicity from the snapshot (1 means solar abundance)
  solar_abundance_Metals: 0.02  
  scale_initial_metallicity: 1    # scale the initial metallicity using solar_abundance_Metals ?

