# Define the system of units to use internally.
InternalUnitSystem:
  UnitMass_in_cgs:     1.988409870698051e+43           # 10^10 solar masses 
  UnitLength_in_cgs:   3.0856775814913673e+21          # 1 kpc 
  UnitVelocity_in_cgs: 1e5                             # km/s
  UnitCurrent_in_cgs:  1                               # Amperes
  UnitTemp_in_cgs:     1                               # Kelvin

# Parameters for the self-gravity scheme
Gravity:
  MAC:              adaptive                           # Choice of mulitpole acceptance criterion: 'adaptive' OR 'geometric'.
  epsilon_fmm:      0.001                              # Tolerance parameter for the adaptive multipole acceptance criterion.
  theta_cr:         0.7                                # Opening angle for the purely gemoetric criterion.
  eta:              0.025                              # Constant dimensionless multiplier for time integration.
  theta:            0.7                                # Opening angle (Multipole acceptance criterion).
  max_physical_baryon_softening: 0.01                  # Physical softening length (in internal units)
  mesh_side_length:        32

# Parameters governing the time integration (Set dt_min and dt_max to the same value for a fixed time-step run.)
TimeIntegration:
  time_begin:        0.                                # The starting time of the simulation (in internal units).
  time_end:          1.0                               # The end time of the simulation (in internal units).
  dt_min:            1e-12                             # The minimal time-step size of the simulation (in internal units).
  dt_max:            1e-2                              # The maximal time-step size of the simulation (in internal units).

# Parameters governing the snapshots
Snapshots:
  subdir:     snap
  basename:   snapshot                                 # Common part of the name of output files
  time_first: 0.                                       # (Optional) Time of the first output if non-cosmological time-integration (in internal units)
  delta_time: 0.01                                     # Time difference between consecutive outputs (in internal units)
  recording_triggers_sink:   [1e-2, 1e-3, 1e-4]        # Recording starts 10M, 1M and 0.1M years before a snapshot

# Parameters governing the restarts
Restarts:
  enable:      1
  delta_hours: 1                                       # Write one restart file per hour

# Parameters governing the scheduler. Note that we set up a lot of extra particles since this example can sometimes create thousands of sinks per timestemp
Scheduler:
  cell_extra_gparts: 10000                             # (Optional) Number of spare sparts per top-level allocated at rebuild time for on-the-fly creation.
  cell_extra_sinks:  10000                             # (Optional) Number of spare sparts per top-level allocated at rebuild time for on-the-fly creation.
  cell_extra_sparts: 10000                             # (Optional) Number of spare sparts per top-level allocated at rebuild time for on-the-fly creation.
  max_top_level_cells: 3
  dependency_graph_frequency: 1                        # (Optional) Dumping frequency of the dependency graph. By default, writes only at the first step.
#  dependency_graph_cell:       3866632                # Once the code crashes, you can get the problematic cells
  links_per_tasks: 30

# Parameters governing the conserved quantities statistics
Statistics:
  delta_time:           1e-2                           # Time between statistics output
  time_first:             0.                           # (Optional) Time of the first stats output if non-cosmological time-integration (in internal units)

# Parameters related to the initial conditions
InitialConditions:
  file_name:         snapshot_0003restart.hdf5         # ICs_homogeneous_box.hdf5 # The file to read
  periodic:          1                                 # Are we running with periodic ICs?

# Parameters for the hydrodynamics scheme
SPH:
  resolution_eta:        1.2348                        # Target smoothing length in units of the mean inter-particle separation (1.2348 == 48Ngbs with the cubic spline kernel).
  CFL_condition:         0.1                           # Courant-Friedrich-Levy condition for time integration.
  minimal_temperature:   1

# Cooling with Grackle 3.0
GrackleCooling:
  # Core Grackle settings. Each optional key states its parser default.
  cloudy_table: CloudyData_UVB=HM2012_high_density.h5  # Cloudy table file (required)
  with_UV_background: 0                                # Metagalactic UV background on or off (required)
  redshift: -1                                         # Redshift of the UV background, -1 follows the simulation time (required)
  with_metal_cooling: 1                                # Metal cooling on or off (required)
  thermal_time_myr: 5                                  # Adiabatic-cooling time in Myr after a feedback event (required)
  maximal_density_Hpcm3: 1e10                          # Cooling density ceiling in H atoms/cm^3, a value < 0 disables it (required)
  max_steps: 10000                                     # Maximal Grackle sub-cycle iterations per particle solve (Default: 10000)
  subcycle_on_failure: 2                               # Retries of a failed solve, each halving the sub-step, in [0, 20] (Default: 2)
  cmb_temperature_floor: 1                             # Grackle's internal CMB temperature floor on or off (Default: 1)
  agora_cmb_temperature_floor: 0                       # AGORA redshift-dependent CMB floor T_CMB,0 (1+z) applied by SWIFT (Default: 0)
  HydrogenFractionByMass: 0.76                         # Hydrogen mass fraction (Default: 0.76)

  # Self-shielding.
  self_shielding_method: -1                            # Continuum self-shielding: -1 GEAR, 0 none, 1 to 3 Grackle (Default: 0)
  self_shielding_threshold_atom_per_cm3: 0.007         # Density threshold in H atoms/cm^3, required with self_shielding_method -1

  # Constant heating rates.
  volumetric_heating_rates_cgs: 0                      # Constant volumetric heating rate [erg/s/cm3] (Default: 0)
  specific_heating_rates_cgs: 0                        # Constant specific heating rate [erg/s/g] (Default: 0)

  # Debug.
  disable_cooling_for_debugging: 0                     # Debug only: skip the per-particle cooling update, cooling_init() still runs (Default: 0)

GEARChemistry:
  initial_metallicity: -1                              # If < 0, use the metallicity sotred in the ICs

GEARFeedback:
  supernovae_Ia_energy_erg: 1e51                       # Energy released by a single supernova.
  supernovae_efficiency: 0.1                           # Supernovae energy efficiency, used for both SNIa and SNII. The energy released effectively is E_sn = supernovae_efficiency*E_sn
  with_stellar_wind_feedback: 0                        # Activate the stellar wind feedback
  yields_table: PopII_parsec_spectral.hdf5             # Table containing the yields of the Pop II stars.
  discrete_yields: 1                                   # Should we use discrete yields or the IMF integrated one?
  imf_transition_metallicity: 0                        # Maximal metallicity ([Fe/H]) for a first star (0 to deactivate).
  elements: [Fe, Mg, O, C, Al, Ca, Ba, Zn, Eu]         # Elements to read in the yields table. The number of element should be one less than the number of elements (N) requested during the configuration (--with-chemistry=GEAR_N).

  # Radiation parameters
  with_radiation_pressure: 0                               # Radiation-pressure momentum channel. The efficiency below is read only when this is 1. (Default: 0)
  radiation_pressure_efficiency: 0                         # Radiation pressure efficiency to boost the radiation pressure momentum injection. (Default: 0.0)
  with_interstellar_radiation_field: 0                     # ISRF master switch: photoelectric heating + dust chemistry (any Grackle mode); H2 photodissociation additionally needs COOLING_GRACKLE_MODE > 1 (grackle_2 or grackle_3). 1: on, 0: off. (Default: 0)
  ISRF_propagation: 0                                       # Run the hyperbolic M1 propagation update on top of injection + receiver-side extinction. Only meaningful when with_interstellar_radiation_field is on. (Default: 0)
  ISRF_extinction_path: pair_separation                     # Receiver-side LW/PE dust extinction column path: the star-to-particle separation of each injected pair (default)
  ISRF_extinction_path_in_kernel_radii: 1.0                 # Extinction path length, in kernel support radii. Read only when ISRF_extinction_path is constant_kernel_path. (Default: 1.0)
  ISRF_c_hyp_scheme: kernel_local                           # ISRF hyperbolic propagation scheme: fixed_fraction (fixed fraction of c) or kernel_local (kernel-local speed); see parameter_example.yml. Only meaningful when ISRF_propagation is on. (Default: kernel_local)
  ISRF_c_hyp_margin: 0.5                                    # Stability-margin coefficient C_hyp in the ISRF_c_hyp_scheme closure. Only meaningful when ISRF_propagation is on. (Default: 0.5)
  ISRF_c_hyp_fixed_fraction_of_c: 0                         # Uniform c_hyp = f*c, only used when ISRF_c_hyp_scheme is fixed_fraction. (Default: 0)
  ISRF_c_hyp_timestep_term_off_for_debugging: 0             # Debug/test only: skip the CFL timestep term for the fixed-fraction speed. Never set in a production run. (Default: 0)
  ISRF_dissipation_alpha_max: 0.5                           # Ceiling of the negativity-triggered artificial-conductivity coefficient. Only meaningful when ISRF_propagation is on. (Default: 0.5)
  ISRF_dissipation_negativity_threshold: 0.01                # Relative undershoot at which the negativity trigger reaches ISRF_dissipation_alpha_max. (Default: 0.01)
  ISRF_dissipation_alpha_floor: 0.5                          # Floor under the negativity trigger, for the front the trigger structurally cannot see. 0 disables it. (Default: 0.5)
  ISRF_dissipation_floor_h_over_lambda: 0.5                  # Screening-length error budget gating the floor's roll-off. (Default: 0.5)
  ISRF_dissipation_floor_relaxation_residual: 0.4            # Flux-relaxation residual gating the floor. 0 disables the gate. (Default: 0.40)
  ISRF_dissipation_alpha_pin_for_debugging: 0                # Debug/test only: bypass the negativity trigger and hold the dissipation coefficient fixed. Never set in a production run. (Default: 0)
  with_photoionization:          0                         # Whether to run with the subgrid photoionization model to mimick Strömgren sphere. 1: Run with photoionization, 0: Run without. (Default: 0)
  HII_min_density_Hpcm3: 1                  # Minimal density to consider a particle eligible for HII ionization (in hydrogen atoms/cm^3)
  HII_max_age_Myr:        50                        # Age (in Myr) at which stars stop doing HII ionization. This is particularly relevant for the SSP star particles. (Default: 50)
  HII_rebuild_time_Myr:   0.5                       # Time between rebuilding the HII region (in Myr). This values also enforce a timestep constraint on the stars. Negative values will not impose any specific rebuild time. (Default: 0.5)

# These parameters are set to trigger sink formation more quickly than in the params.yml file
GEARSink:
  use_fixed_cut_off_radius: 1                          # Are we using a fixed cutoff radius? If we are, in GEAR the cutoff radius is fixed at the value specified below, and the sink smoothing length is fixed at this value divided by kernel_gamma. If not,
                                                       # the cutoff radius varies with the sink smoothing length as r_cut = h*kernel_gamma.
  cut_off_radius: 1e-2                                 # Cut off radius of all the sinks in internal units.
  f_acc: 0.1
  temperature_threshold_K: 3e4                         # Max temperature (in K) for forming a sink when density_threshold_Hpcm3 <= density <= maximal_density_threshold_Hpcm3.
  density_threshold_Hpcm3: 1e1                         # Minimum gas density (in g/cm3) required to form a sink particle
  maximal_density_threshold_Hpcm3: 1e2                 # If the gas density exceeds this value (in g/cm3), a sink forms regardless of temperature if all other criteria are passed
  stellar_particle_mass_Msun: 60                       # Mass of the stellar particle representing the low mass stars, in solar mass
  minimal_discrete_mass_Msun: 8                        # Minimal mass of stars represented by discrete particles, in solar mass
  stellar_particle_mass_first_stars_Msun: 60           # Mass of the stellar particle representing the low mass stars, in solar mass
  minimal_discrete_mass_first_stars_Msun: 8            # Minimal mass of stars represented by discrete particles, in solar mass
  star_spawning_sigma_factor: 0.5                      # Factor to rescale the velocity dispersion of the stars when they are spawned. (Default: 0.2)
  sink_formation_contracting_gas_criterion: 0          # (Optional) Activate the contracting gas check for sink formation. (Default: 1)
  sink_formation_smoothing_length_criterion: 0         # (Optional) Activate the smoothing length check for sink formation. (Default: 1)
  sink_formation_jeans_instability_criterion: 0        # (Optional) Activate the two Jeans instability checks for sink formation. (Default: 1)
  sink_formation_bound_state_criterion: 0              # (Optional) Activate the bound state check for sink formation. (Default: 1)
  sink_formation_overlapping_sink_criterion: 0         # (Optional) Activate the overlapping sink check for sink formation. (Default: 1)
  disable_sink_formation: 0                            # (Optional) Disable sink formation. (Default: 0)

  # Timesteps parameters
  CFL_condition:                        0.8            # Courant-Friedrich-Levy condition for time integration.
  timestep_age_threshold_unlimited_Myr: 100.           # (Optional) Age above which sinks have no time-step restriction any more (in Mega-years). Defaults to 0.
  timestep_age_threshold_Myr:           25.            # (Optional) Age at which sink switch from young to old for time-stepping purposes (in Mega-years). Defaults to FLT_MAX.
  max_timestep_young_Myr:               2.             # (Optional) Maximal time-step length of young sinks (in Mega-years). Defaults to FLT_MAX.
  max_timestep_old_Myr:                 5.             # (Optional) Maximal time-step length of old sinks (in Mega-years). Defaults to FLT_MAX.
#  n_IMF:                               2.             # (Optional) Number of times the IMF mass can be swallowed in a single timestep. (Default: FLTM_MAX)

# Use GEAR SF if needed
GEARStarFormation:
  star_formation_efficiency: 0.01                      # star formation efficiency (c_*)
  maximal_temperature_K:     3e4                       # Upper limit to the temperature of a star forming particle
  density_threshold_Hpcm3:   10                        # Density threshold in Hydrogen atoms/cm3
  n_stars_per_particle: 4
  min_mass_frac: 0.5

# GEAR SF requires this to be set
GEARPressureFloor:
  jeans_factor: 10

Stars:
  HII_max_search_radius: 0.1  # Max HII search radius (internal units).
  timestep_age_threshold_unlimited_Myr: 30.            # (Optional) Age above which sinks have no time-step restriction any more (in Mega-years). Defaults to 0.
  timestep_age_threshold_Myr:           10.            # (Optional) Age at which sink switch from young to old for time-stepping purposes (in Mega-years). Defaults to FLT_MAX.
  max_timestep_young_Myr:               1              # (Optional) Maximal time-step length of young sinks (in Mega-years). Defaults to FLT_MAX.
  max_timestep_old_Myr:                 5              # (Optional) Maximal time-step length of old sinks (in Mega-years). Defaults to FLT_MAX.

