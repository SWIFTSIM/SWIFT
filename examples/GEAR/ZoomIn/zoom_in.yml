# Define the system of units to use internally. 
InternalUnitSystem:
  UnitMass_in_cgs:     1.98841e43    # 10^10 M_sun in grams
  UnitLength_in_cgs:   3.08567758e21 # kpc in centimeters
  UnitVelocity_in_cgs: 1e5           # km/s in centimeters per second
  UnitCurrent_in_cgs:  1             # Amperes
  UnitTemp_in_cgs:     1             # Kelvin

Restarts:
  enable:        1
  delta_hours:   1.                  # (Optional) decimal hours between dumps of restart files.

Scheduler:
  max_top_level_cells:       64
  cell_sub_size_self_grav:   2048
  cell_subdepth_diff_grav:   2
  cell_split_size:           200
  cell_extra_gparts:         100     # (Optional) Number of spare gparts per top-level allocated at rebuild time for on-the-fly creation.
  
# Parameters governing the time integration
TimeIntegration:
  dt_min:     1e-16        # The minimal time-step size of the simulation (in internal units).
  dt_max:     0.1          # The maximal time-step size of the simulation (in internal units).
  max_dt_RMS_factor: 0.25  # (Optional) Dimensionless factor for the maximal displacement allowed based on the RMS velocities.
  dt_RMS_use_gas_only: 1 
  
# Cosmological parameters
Cosmology:
  h:              0.673        # Reduced Hubble constant
  a_begin:        0.014084507042253521     # Initial scale-factor of the simulation
  a_end:          1.0           # Final scale factor of the simulation
  Omega_cdm:      0.2664        # Cold Dark Matter density parameter
  Omega_lambda:   0.685         # Dark-energy density parameter
  Omega_b:        0.0486        # Baryon density parameter
  Omega_r:        0.            # (Optional) Radiation density parameter
  w_0:            -1.0          # (Optional) Dark-energy equation-of-state parameter at z=0.
  w_a:            0.            # (Optional) Dark-energy equation-of-state time evolution parameter.

# Parameters governing the snapshots
Snapshots:
  basename:            h050         # Common part of the name of output files
  subdir:              snap
  time_first:          0.           # Time of the first output (in internal units)
  delta_time:          1e-2         # Time difference between consecutive outputs (in internal units)
  compression:         4
  output_list_on:      1            # (Optional) Enable the output list
  output_list:         snaplist.txt # (Optional) File containing the output times (see documentation in "Parameter File" section)
  recording_triggers_sink: [-1, -1, -1]

# Parameters governing the conserved quantities statistics
Statistics:
  scale_factor_first: 0.0141
  delta_time:          1.02          # Time between statistics output

# Parameters for the self-gravity scheme
Gravity:
  eta:                        0.05             # Constant dimensionless multiplier for time integration.
  MAC:                        geometric        # Choice of mulitpole acceptance criterion: 'adaptive' OR 'geometric'.
  epsilon_fmm:                0.001            # Tolerance parameter for the adaptive multipole acceptance criterion.
  theta_cr:                   0.7              # Opening angle for the purely gemoetric criterion.
  comoving_DM_softening:      0.2823           # Comoving softening length (in internal units).
  max_physical_DM_softening:  0.07429          # Physical softening length (in internal units).
  comoving_baryon_softening:     0.07429       # Comoving softening length (in internal units).
  max_physical_baryon_softening: 0.01485       # Physical softening length (in internal units).
  softening_ratio_background:    0.0285714     # Fraction of the mean inter-particle separation to use as Plummer-equivalent softening for the background DM particles.
  mesh_side_length:       128                  # Number of cells along each axis for the periodic gravity mesh.
  
# Parameters for the hydrodynamics scheme
SPH:
  resolution_eta:        1.2348                # Target smoothing length in units of the mean inter-particle separation (1.2348 == 48Ngbs with the cubic spline kernel).
  CFL_condition:         0.1                   # Courant-Friedrich-Levy condition for time integration.
  minimal_temperature:   10.                   # Kelvin
  h_min_ratio:           0.0714285714285       # (Optional) Minimal allowed smoothing length in units of the softening. Defaults to 0 if unspecified.
  h_max:                 100                   # (Optional) Maximal allowed smoothing length in internal units. Defaults to FLT_MAX if unspecified.

# Parameters related to the initial conditions
InitialConditions:
  file_name:  ./h050.hdf5           # The file to read
  periodic:   1                     # Non-periodic BCs
  cleanup_h_factors: 1              # Remove the h-factors inherited from Gadget
  shift:    [0, 0, 0]               # Centre the box
  cleanup_velocity_factors:    1    # (Optional) Clean up the scale-factors used in the definition of the velocity variable in the ICs (e.g. in Gadget files).
  cleanup_smoothing_lengths:   1    # (Optional) Clean the values of the smoothing lengths that are read in to remove stupid values. Set to 1 to activate.

# Cooling with Grackle 3.0
GrackleCooling:
  # Core Grackle settings. Each optional key states its parser default.
  cloudy_table: CloudyData_UVB=HM2012.h5        # Cloudy table file (required)
  with_UV_background: 1                         # Metagalactic UV background on or off (required)
  redshift: -1                                  # Redshift of the UV background, -1 follows the simulation time (required)
  with_metal_cooling: 1                         # Metal cooling on or off (required)
  thermal_time_myr: 5                           # Adiabatic-cooling time in Myr after a feedback event (required)
  maximal_density_Hpcm3: -1                     # Cooling density ceiling in H atoms/cm^3, a value < 0 disables it (required)
  max_steps: 10000                              # Maximal Grackle sub-cycle iterations per particle solve (Default: 10000)
  subcycle_on_failure: 2                        # Retries of a failed solve, each halving the sub-step, in [0, 20] (Default: 2)
  cmb_temperature_floor: 1                      # Grackle's internal CMB temperature floor on or off (Default: 1)
  agora_cmb_temperature_floor: 0                # AGORA redshift-dependent CMB floor T_CMB,0 (1+z) applied by SWIFT (Default: 0)
  HydrogenFractionByMass: 0.76                  # Hydrogen mass fraction (Default: 0.76)

  # Self-shielding.
  self_shielding_method: -1                     # Continuum self-shielding: -1 GEAR, 0 none, 1 to 3 Grackle (Default: 0)
  self_shielding_threshold_atom_per_cm3: 0.007  # Density threshold in H atoms/cm^3, required with self_shielding_method -1

  # Constant heating rates.
  volumetric_heating_rates_cgs: 0               # Constant volumetric heating rate [erg/s/cm3] (Default: 0)
  specific_heating_rates_cgs: 0                 # Constant specific heating rate [erg/s/g] (Default: 0)

  # Debug.
  disable_cooling_for_debugging: 0              # Debug only: skip the per-particle cooling update, cooling_init() still runs (Default: 0)

GEARStarFormation:
  star_formation_efficiency: 0.01   # star formation efficiency (c_*)
  maximal_temperature_K:     3e4    # Upper limit to the temperature of a star forming particle
  density_threshold_Hpcm3:   0.1    # Density threshold in Hydrogen atoms/cm3
  n_stars_per_particle: 4
  min_mass_frac: 0.5

GEARPressureFloor:
  jeans_factor: 10

GEARFeedback:
  supernovae_Ia_energy_erg: 1e51                           # Energy released by a single supernova.
  supernovae_efficiency: 0.1                               # Supernovae energy efficiency, used for both SNIa and SNII. The energy released effectively is E_sn = supernovae_efficiency*E_sn
  with_stellar_wind_feedback: 0                            # Deactivate the stellar wind feedback
  yields_table: POPIIsw.h5                                 # Table containing the yields.
  discrete_yields: 1                                       # Should we use discrete yields or the IMF integrated one?
  imf_transition_metallicity: 0                            # Maximal metallicity (in mass fraction) for a first star (-1 to deactivate).
  elements: [Fe, Mg, O, C, Al, Ca, Ba, Zn, Eu]             # Elements to read in the yields table. The number of element should be one less than the number of elements (N) requested during the configuration (--with-chemistry=GEAR_N).

  # Radiation parameters
  with_radiation_pressure: 0                               # Radiation-pressure momentum channel. The efficiency below is read only when this is 1. (Default: 0)
  radiation_pressure_efficiency: 0                         # Radiation pressure efficiency to boost the radiation pressure momentum injection. (Default: 0.0)
  with_interstellar_radiation_field:    0                         # Whether to run with the subgrid photoelectric heating model to mimick Strömgren sphere. Note this needs to compile with GRACKLE_X, X=1,2 or 3 and will automatically turn on grackle
                                                           # photoelectric parameters. 1: Run with photoelectric heating, 0: Run without. (Default: 0)
  with_photoionization:          0                         # Whether to run with the subgrid photoionization model to mimick Strömgren sphere. 1: Run with photoionization, 0: Run without. (Default: 0)
  HII_min_density_Hpcm3: 1                  # Minimal density to consider a particle eligible for HII ionization (in hydrogen atoms/cm^3)
  HII_max_age_Myr:        50                        # Age (in Myr) at which stars stop doing HII ionization. This is particularly relevant for the SSP star particles. (Default: 50)
  HII_rebuild_time_Myr:   0.5                       # Time between rebuilding the HII region (in Myr). This values also enforce a timestep constraint on the stars. Negative values will not impose any specific rebuild time. (Default: 0.5)

GEARChemistry:
  initial_metallicity: 0
  scale_initial_metallicity: 0
