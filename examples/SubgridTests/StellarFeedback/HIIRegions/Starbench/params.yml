# Define the system of units to use internally.
InternalUnitSystem:
  UnitMass_in_cgs:     1.988409870698051e+43   # 10^10 solar masses
  UnitLength_in_cgs:   3.0856775814913673e+21  # 1 kpc
  UnitVelocity_in_cgs: 1e5                     # km/s
  UnitCurrent_in_cgs:  1                       # Amperes
  UnitTemp_in_cgs:     1                       # Kelvin

Restarts:
  enable: 1
  delta_hours: 0.1
  resubmit_on_exit: 0

# Parameters for the self-gravity scheme
Gravity:
  MAC:                           adaptive  # Choice of mulitpole acceptance criterion: 'adaptive' OR 'geometric'.
  epsilon_fmm:                   0.001     # Tolerance parameter for the adaptive multipole acceptance criterion.
  theta_cr:                      0.7       # Opening angle for the purely gemoetric criterion.
  eta:          0.025                      # Constant dimensionless multiplier for time integration.
  max_physical_baryon_softening: 0.005     # Physical softening length (in internal units)
  mesh_side_length:        32

# Parameters governing the time integration -- time_end=3.068e-3 is exactly
# 3.0 Myr, matching STARBENCH's (Bisbas et al. 2015) late-phase test.
TimeIntegration:
  time_begin:        0.
  time_end:          3.068e-3
  dt_min:            1e-10
  dt_max:            1e-5

# Parameters governing the snapshots
Snapshots:
  subdir: snap
  basename:   snapshot
  time_first: 0.0
  delta_time: 5e-5
  recording_triggers_sink:   [-1, -1, -1]
  compression: 9  # Lossless HDF5 gzip compression

Scheduler:
  cell_extra_gparts: 10
  cell_extra_sinks:  10
  cell_extra_sparts: 10
  max_top_level_cells: 3
  tasks_per_cell: 100

Statistics:
  delta_time:           5e-5
  time_first:             0.

# Parameters related to the initial conditions
InitialConditions:
  file_name:          ICs_starbench.hdf5
  periodic:                 1
  shift:              [0.0, 0.0, 0.0]

# Parameters for the hydrodynamics scheme
SPH:
  resolution_eta:        1.2348
  CFL_condition:         0.1
  minimal_temperature:   1000  # Floors the neutral gas near STARBENCH's T_o=1e3 K. A direct check
                               # found this code's real cooling physics (metal-line cooling at
                               # Z/Zsun~0.231, needed to hit T_i=1e4 K) collapses the neutral gas to
                               # ~2-5 K almost immediately -- nowhere near T_o -- which removes the
                               # pressure confinement the STARBENCH stagnation radius depends on.
                               # This floor does not hold gas fixed at T_o (it can still heat freely,
                               # just not cool below this), so the ionization front still propagates
                               # normally. See README.
  initial_temperature:   1000  # Initial neutral-gas temperature, matching the floor above.

# Cooling with Grackle 3.0
GrackleCooling:
  cloudy_table: CloudyData_UVB=HM2012.h5
  with_UV_background: 0
  redshift: -1
  with_metal_cooling: 1
  self_shielding_method: -1
  self_shielding_threshold_atom_per_cm3: 0.007
  thermal_time_myr: 0
  maximal_density_Hpcm3: 1e4
  HydrogenFractionByMass: 0.76     # Hydrogen fraction by mass. (Default: 0.76)
  use_radiative_transfer: 0        # Arrays of ionization/heating rates are provided. (Default: 0)
  cmb_temperature_floor: 1         # Enable/disable an effective CMB temperature floor. (Default: 1)
  RT_heating_rate_cgs: 0           # Heating rate in units of / nHI_cgs. (Default: 0)
  RT_HI_ionization_rate_cgs: 0     # HI ionization rate in cgs [1/s]. (Default: 0)
  RT_HeI_ionization_rate_cgs: 0    # HeI ionization rate in cgs [1/s]. (Default: 0)
  RT_HeII_ionization_rate_cgs: 0   # HeII ionization rate in cgs [1/s]. (Default: 0)
  volumetric_heating_rates_cgs: 0  # Volumetric heating rate in cgs [erg/s/cm3]. (Default: 0)
  specific_heating_rates_cgs: 0    # Specific heating rate in cgs [erg/s/g]. (Default: 0)
  initial_nHII_to_nH_ratio: -1     # Initial nHII to nH ratio (number density ratio). Ignored if -1. (Default: -1)
  initial_nHeI_to_nH_ratio: -1     # Initial nHeI to nH ratio (number density ratio). Ignored if -1. (Default: -1)
  initial_nHeII_to_nH_ratio: -1    # Initial nHeII to nH ratio (number density ratio). Ignored if -1. (Default: -1)
  initial_nHeIII_to_nH_ratio: -1   # Initial nHeIII to nH ratio (number density ratio). Ignored if -1. (Default: -1)

GEARChemistry:
  initial_metallicity: 0
  scale_initial_metallicity: 1
  diffusion_coefficient: 1e-3  # Coefficient for the diffusion (see Shen et al. 2010; differs by gamma^2 due to h^2). (Default: 1e-3)

GEARFeedback:
  # Stellar evolution
  yields_table: radiation_fits_popII.hdf5                                  # Stellar yields table filename
  yields_table_first_stars: radiation_fits_popII.hdf5                      # First-star (Pop III) yields table
  imf_transition_metallicity: -5                            # Pop III/II IMF cutoff, [Fe/H] (default)
  discrete_yields: 1                                        # Use discrete stellar yields
  elements: [Fe, Mg, O, C, Al, Ca, Ba, Zn, Eu]              # Chemical elements read from yields table
  discrete_star_minimal_gravity_mass_Msun: 0.1
  dt_evolution_factor_max: 300                              # Young-SSP timestep refinement factor (default)
  event_dt_floor_Myr: 1e-4

  # Supernovae
  supernovae_Ia_energy_erg: 1e51
  supernovae_efficiency: 0                                  # SN energy efficiency, SNIa+SNII

  # Stellar winds
  with_stellar_wind_feedback: 0                             # Stellar wind feedback switch

  # HII regions
  with_photoionization: 1                                   # Subgrid photoionization switch
  HII_min_density_Hpcm3: 1
  HII_max_age_Myr: 50
  HII_rebuild_time_Myr: 0.01                                # HII region rebuild cadence, Myr
  HII_angular_nside: 0                                      # HEALPix splitting of HII budget, 0=spherical (default)
  HII_deterministic_boundary_ionization: 0                  # Boundary-particle ionization rule (default)
  HII_rebuild_floor_Myr: 1e-4
  HII_couple_ionization_rate: 0                             # Rate-couple HII into Grackle's RT fields (default)

Stars:
  timestep_age_threshold_unlimited_Myr: 11.
  timestep_age_threshold_Myr:           7.
  max_timestep_young_Myr:               0.5
  max_timestep_old_Myr:                 1
  CFL_condition: 0.5        # Looser than the global 0.1 default: this example stress-tests
                            # HII ionization physics, not stellar dynamical resolution.
  HII_max_search_radius: 0.0049   # 4.9 pc: just inside the box half-width (5 pc), so the
                                  # search can reach essentially the full box without tripping
                                  # the T6 startup warning about exceeding the periodic wrap
                                  # distance.
  HII_max_retry_full_buffer: 30
  HII_max_radius_expansion_tries: 5
  HII_radius_expansion_factor: 1.1
  min_star_timestep_Myr: 1e-4
  overwrite_birth_time: 0         # Overwrite the birth time of stars read from the ICs? (Default: 0)
  birth_time: -1                  # Birth time used for all stars if overwrite_birth_time is 1 (-1 means the stars remain inactive feedback-wise throughout the run).
  overwrite_birth_density: 0      # Overwrite the birth density of stars read from the ICs? (Default: 0)
  birth_density: -1               # Birth density used for all stars if overwrite_birth_density is 1.
  overwrite_birth_temperature: 0  # Overwrite the birth temperature of stars read from the ICs? (Default: 0)
  birth_temperature: -1           # Birth temperature used for all stars if overwrite_birth_temperature is 1.
