# Define the system of units to use internally.
InternalUnitSystem:
  UnitMass_in_cgs:     1.988409870698051e+43   # 10^10 solar masses
  UnitLength_in_cgs:   3.0856775814913673e+21  # 1 kpc
  UnitVelocity_in_cgs: 1e5                     # km/s
  UnitCurrent_in_cgs:  1                       # Amperes
  UnitTemp_in_cgs:     1                       # Kelvin

Restarts:
  enable: 0

# No Potential: block, since --external-gravity (run.sh) is a no-op force,
# matching the sibling StromgrenSphere* examples'
# idiom for "no gravity".
Gravity:
  MAC:                           adaptive
  epsilon_fmm:                   0.001
  theta_cr:                      0.7
  eta:          0.025
  max_physical_baryon_softening: 0.005
  mesh_side_length:        32

# Parameters governing the time integration.
TimeIntegration:
  time_begin:        0.
  time_end:          1.5e-4
  dt_min:            1e-12
  dt_max:            1e-6

# Parameters governing the snapshots
Snapshots:
  subdir: snap
  basename:   snapshot
  time_first: 0.0
  delta_time: 1e-5
  recording_triggers_sink:   [-1, -1, -1]
  compression: 9

Scheduler:
  cell_extra_gparts: 10
  cell_extra_sinks:  10
  cell_extra_sparts: 10
  max_top_level_cells: 3
  tasks_per_cell: 150

Statistics:
  delta_time:           1e-6
  time_first:             0.

# Parameters related to the initial conditions
InitialConditions:
  file_name:          ICs_isrf_photoelectric_heating.hdf5
  periodic:                 1
  shift:              [0.0, 0.0, 0.0]

# Parameters for the hydrodynamics scheme
SPH:
  resolution_eta:        1.2348
  CFL_condition:         0.1
  minimal_temperature:   1
  initial_temperature:   1000

GEARChemistry:
  # Solar (Z/Zsun=1): the receiver-side dust extinction this example also
  # exercises is only meaningful for a nonzero, known metallicity.
  initial_metallicity: 1
  scale_initial_metallicity: 1
  diffusion_coefficient: 1e-3

GeajayCooling:
  dust_to_gas_model: linear                      # Dust-to-gas ratio model (required): linear or remy_ruyer_2014
  isrf_habing: 1.7                             # G_0 [Habing], required: the ISRF turns the dust on. The solve reads the ISRF G_0 of each particle instead
  cloudy_table_file: CloudyData_UVB=HM2012.h5   # Cloudy table file (required)
  primordial_chemistry_network: 3               # 0 tabulated, 1 H/He, 2 + H2, 3 + D; run.sh sets it from the build (required)
  with_uv_background: 0                         # Metagalactic UV background on or off (required)
  redshift: -1                                  # Redshift of the UV background, -1 follows the simulation time (required)
  with_metal_cooling: 1                         # Metal cooling on or off (required)
  thermal_time_myr: 0                           # Adiabatic-cooling time in Myr after a feedback event (required)
  h2_shielding_length_method: none              # H2 self-shielding length (required with a network that tracks H2)
  # Photoelectric heating model: none (0), fixed_rate (1), constant_efficiency (2), grain_charge_epsilon (3) or
  # density_epsilon (4). run.sh sets it from pe_model.
  photoelectric_heating_model: constant_efficiency

GEARFeedback:
  # Stellar evolution
  yields_table: PopII_parsec_spectral.hdf5                  # Stellar yields table, with the Data/Radiation group
  yields_table_first_stars: PopII_parsec_spectral.hdf5      # First-star table; the same file, so the ISRF source is Pop II either side of the transition
  imf_transition_metallicity: -5                            # Pop III/II IMF cutoff, [Fe/H] (default)
  discrete_yields: 1                                        # Use discrete stellar yields
  elements: [Fe, Mg, O, C, Al, Ca, Ba, Zn, Eu]              # Chemical elements read from yields table
  discrete_star_minimal_gravity_mass_Msun: 0.1
  dt_evolution_factor_max: 300                              # Young-SSP timestep refinement factor (default)
  event_dt_floor_Myr: 1e-4

  # Supernovae
  supernovae_Ia_energy_erg: 1e51
  supernovae_efficiency: 0                                  # SN energy efficiency, SNIa+SNII

  # Stellar winds
  with_stellar_wind_feedback: 0                             # Stellar wind feedback switch

  # ISRF
  with_interstellar_radiation_field: 1                             # ISRF feedback master switch
  ISRF_extinction_path: pair_separation                     # Receiver-side LW/PE dust extinction column path: the star-to-particle separation of each injected pair (default)
  ISRF_propagation: 0                                       # 1: transport the ISRF from the stars (needs --with-chealpix), 0: dose added at once

Stars:
  timestep_age_threshold_unlimited_Myr: 11.
  timestep_age_threshold_Myr:           7.
  max_timestep_young_Myr:               0.1
  max_timestep_old_Myr:                 1
  min_star_timestep_Myr: 1e-4
  # Photoionization is off in this example, so this search radius is
  # otherwise inert, but it must still stay under the box half-width.
  HII_max_search_radius: 0.001
  HII_max_retry_full_buffer: 30
  HII_max_radius_expansion_tries: 5
  HII_radius_expansion_factor: 1.1
  overwrite_birth_time: 0
  birth_time: -1
  overwrite_birth_density: 0
  birth_density: -1
  overwrite_birth_temperature: 0
  birth_temperature: -1
