# Define the system of units to use internally.
InternalUnitSystem:
  UnitMass_in_cgs:     1.988409870698051e+43   # 10^10 solar masses
  UnitLength_in_cgs:   3.0856775814913673e+21  # 1 kpc
  UnitVelocity_in_cgs: 1e5                     # km/s
  UnitCurrent_in_cgs:  1                       # Amperes
  UnitTemp_in_cgs:     1                       # Kelvin

Restarts:
  enable: 0

# Read only with --cosmology. a_begin and a_end are run.sh overrides.
Cosmology:
  h:              0.6777
  a_begin:        0.1
  a_end:          0.125
  Omega_lambda:   0.693
  Omega_cdm:      0.2587481
  Omega_b:        0.0482519
  Omega_r:        0.

# time_begin, time_end and dt_max are run.sh overrides (dt_max is a step in ln a with
# cosmology, and time_begin and time_end are then not read).
TimeIntegration:
  time_begin:        0.
  time_end:          2.2e-1
  dt_min:            1e-16
  dt_max:            1e-4

# delta_time is multiplicative in a with cosmology (run.sh override).
Snapshots:
  subdir:             snap
  basename:           snapshot
  time_first:         0.
  scale_factor_first: 0.1
  delta_time:         5.5e-3
  compression:        1

Scheduler:
  cell_extra_gparts: 10
  cell_extra_sinks:  10
  cell_extra_sparts: 10
  max_top_level_cells: 4
  tasks_per_cell: 150

Statistics:
  time_first:         0.
  scale_factor_first: 0.1
  delta_time:         5.5e-3

InitialConditions:
  file_name:          ICs_isrf_cosmology.hdf5
  periodic:           1

SPH:
  resolution_eta:        1.2348
  CFL_condition:         0.1
  minimal_temperature:   1
  initial_temperature:   0                     # 0: makeIC.py writes the internal energy

GEARChemistry:
  initial_metallicity: 1.54e-6                 # Absolute metal mass fraction, not in solar units
  scale_initial_metallicity: 0

GrackleCooling:
  # Core Grackle settings. Each optional key states its parser default.
  cloudy_table: CloudyData_UVB=HM2012.h5        # Cloudy table file (required)
  with_UV_background: 0                         # Metagalactic UV background on or off (required)
  redshift: -1                                  # Redshift of the UV background, -1 follows the simulation time (required)
  with_metal_cooling: 1                         # Metal cooling on or off (required)
  thermal_time_myr: 0                           # Adiabatic-cooling time in Myr after a feedback event (required)
  maximal_density_Hpcm3: 1e4                    # Cooling density ceiling in H atoms/cm^3, a value < 0 disables it (required)
  max_steps: 10000                              # Maximal Grackle sub-cycle iterations per particle solve (Default: 10000)
  subcycle_on_failure: 2                        # Retries of a failed solve, each halving the sub-step, in [0, 20] (Default: 2)
  cmb_temperature_floor: 0                      # Off: the gas state is fixed (Default: 1)
  agora_cmb_temperature_floor: 0                # AGORA redshift-dependent CMB floor T_CMB,0 (1+z) applied by SWIFT (Default: 0)
  HydrogenFractionByMass: 0.76                  # Hydrogen mass fraction (Default: 0.76)

  # H2 and self-shielding. These settings have no effect without primordial chemistry, as in the
  # grackle_0 build of this example: there is no H2 for Grackle to shield. A run with H2 needs
  # H2_self_shielding 2 or 3, otherwise the Lyman-Werner field reaches Grackle unshielded.
  H2_self_shielding: 3                          # Local Jeans length (Default: 0)
  H2_self_shielding_path: kernel_radius         # Mode 2 only: column path kernel_radius or kernel_diameter (Default: kernel_radius)
  H2_on_dust: 0                                 # H2 formation on dust grains (Default: 0)
  H2_photodissociation_heating: 0               # Heating per H2 photodissociation, needs mode >= 2 and a Grackle that provides it (Default: 0)
  H2_three_body_rate: 0                         # H2 three-body formation rate model, 0 to 5 (Grackle documentation) (Default: 0)
  H2_cie_cooling: 0                             # H2 collision-induced emission cooling (Ripamonti & Abel 2004) (Default: 0)
  self_shielding_method: 0                      # Off (Default: 0)

  # Photoelectric heating and dust, used only with GEARFeedback:with_interstellar_radiation_field.
  photoelectric_heating_efficiency: constant    # constant, wolfire1995 or density_dependent (Default: constant)
  local_dust_to_gas_ratio: -1                   # Dust-to-gas mass ratio, -1 keeps Grackle's own default (Default: -1)

  # Chemistry network: initial abundances as number ratios to nH, -1 keeps the default.
  initial_nHII_to_nH_ratio: 1e-8                # Residual ionization (Default: -1)
  initial_nHeI_to_nH_ratio: -1                  # nHeI / nH (Default: -1)
  initial_nHeII_to_nH_ratio: -1                 # nHeII / nH (Default: -1)
  initial_nHeIII_to_nH_ratio: -1                # nHeIII / nH (Default: -1)
  initial_nHM_to_nH_ratio: -1                   # nHM / nH (Default: -1)
  initial_nH2I_to_nH_ratio: 1e-8                # H2 fraction (Default: -1)
  initial_nH2II_to_nH_ratio: -1                 # nH2II / nH (Default: -1)
  initial_nDI_to_nH_ratio: -1                   # nDI / nH (Default: -1)
  initial_nDII_to_nH_ratio: -1                  # nDII / nH (Default: -1)
  initial_nHDI_to_nH_ratio: -1                  # nHDI / nH (Default: -1)

  # Radiation field and RT rates (cgs).
  use_radiative_transfer: 0                     # Ionization and heating rates are provided; forced on by HII_couple_ionization_rate, and by the ISRF in grackle_2 and grackle_3 builds (Default: 0)
  RT_heating_rate_cgs: 0                        # Heating rate per nHI, cgs (Default: 0)
  RT_HI_ionization_rate_cgs: 0                  # HI ionization rate [1/s] (Default: 0)
  RT_HeI_ionization_rate_cgs: 0                 # HeI ionization rate [1/s] (Default: 0)
  RT_HeII_ionization_rate_cgs: 0                # HeII ionization rate [1/s] (Default: 0)
  RT_H2_dissociation_rate_cgs: 0                # H2 dissociation rate [1/s], keep 0 when the ISRF supplies it (Default: 0)

  # Constant heating rates.
  volumetric_heating_rates_cgs: 0               # Constant volumetric heating rate [erg/s/cm3] (Default: 0)
  specific_heating_rates_cgs: 0                 # Constant specific heating rate [erg/s/g] (Default: 0)

  # Debug.
  disable_cooling_for_debugging: 1              # Gas state frozen: the example follows the light only; cooling_init() still resolves chemistry_data (Default: 0)

GEARFeedback:
  # Stellar evolution
  yields_table: PopII_parsec_spectral_with_pe_photon_energy.hdf5                  # Stellar yields table, with the Data/Radiation group
  yields_table_first_stars: PopII_parsec_spectral_with_pe_photon_energy.hdf5      # First-star table; the same file, so the ISRF source is Pop II either side of the transition
  imf_transition_metallicity: -5                            # Pop III/II IMF cutoff, [Fe/H] (default)
  discrete_yields: 1                                        # Use discrete stellar yields
  elements: [Fe, Mg, O, C, Al, Ca, Ba, Zn, Eu]              # Chemical elements read from yields table
  discrete_star_minimal_gravity_mass_Msun: 0.1
  dt_evolution_factor_max: 300                              # Young-SSP timestep refinement factor (default)
  event_dt_floor_Myr: 1e-4

  # Supernovae
  supernovae_Ia_energy_erg: 1e51
  supernovae_efficiency: 0                                  # SN energy efficiency, SNIa+SNII

  # Stellar winds
  with_stellar_wind_feedback: 0                             # Stellar wind feedback switch

  # ISRF
  with_interstellar_radiation_field: 1                      # ISRF feedback master switch
  ISRF_extinction_path: pair_separation                     # Receiver-side dust extinction path: the star-to-particle separation (default)
  ISRF_propagation: 1                                       # Transport the light of the stars (needs --with-chealpix)
  ISRF_packet_light_speed: cap                              # Speed limit of the light: cap, fixed or unlimited (default)
  ISRF_packet_light_speed_fraction_of_c: 0.99               # Limit speed as a fraction of c (default)
  ISRF_packet_cone_power: 4                                 # Power of the transmission cone, larger is narrower (default)

Stars:
  timestep_age_threshold_unlimited_Myr: 11.
  timestep_age_threshold_Myr:           7.
  max_timestep_young_Myr:               10
  max_timestep_old_Myr:                 1
  min_star_timestep_Myr:                1e-9
  # Photoionization is off, so this search radius is inert, but it must stay under the box half-width.
  HII_max_search_radius: 0.0002
  HII_max_retry_full_buffer: 30
  HII_max_radius_expansion_tries: 5
  HII_radius_expansion_factor: 1.1
  overwrite_birth_time: 0
