# Define the system of units to use internally.
InternalUnitSystem:
  UnitMass_in_cgs:     1.988409870698051e+43   # 10^10 solar masses
  UnitLength_in_cgs:   3.0856775814913673e+21  # 1 kpc
  UnitVelocity_in_cgs: 1e5                     # km/s
  UnitCurrent_in_cgs:  1                       # Amperes
  UnitTemp_in_cgs:     1                       # Kelvin

Restarts:
  enable: 0

# No Potential: block -- --external-gravity (run.sh) is a no-op force,
# matching the sibling StromgrenSphere* examples' idiom for "no gravity".
Gravity:
  MAC:                           adaptive
  epsilon_fmm:                   0.001
  theta_cr:                      0.7
  eta:          0.025
  max_physical_baryon_softening: 0.005
  mesh_side_length:        32

# Parameters governing the time integration -- long enough to track the
# shell's dynamical response to radiation pressure (see README).
TimeIntegration:
  time_begin:        0.
  time_end:          3.1e-3  # ~3 Myr
  dt_min:            1e-12
  dt_max:            1e-5  # ~0.0098 Myr

# Parameters governing the snapshots
Snapshots:
  subdir: snap
  basename:   snapshot
  time_first: 0.0
  delta_time: 5e-5  # ~62 snapshots over the run
  recording_triggers_sink:   [-1, -1, -1]
  compression: 9

Scheduler:
  cell_extra_gparts: 10
  cell_extra_sinks:  10
  cell_extra_sparts: 10
  max_top_level_cells: 3
  tasks_per_cell: 150

Statistics:
  delta_time:           1e-5
  time_first:             0.

# Parameters related to the initial conditions
InitialConditions:
  file_name:          ICs_radiation_pressure.hdf5
  periodic:                 1
  shift:              [0.0, 0.0, 0.0]

# Parameters for the hydrodynamics scheme
SPH:
  resolution_eta:        1.2348
  CFL_condition:         0.1
  minimal_temperature:   1
  initial_temperature:   1000

# Cooling with Grackle 3.0 -- present for parser completeness; never invoked
# since run.sh does not pass --cooling (this test isolates radiation pressure
# from photoionization/thermal effects, see README).
GrackleCooling:
  # Core Grackle settings. Each optional key states its parser default.
  cloudy_table: CloudyData_UVB=HM2012.h5        # Cloudy table file (required)
  with_UV_background: 0                         # Metagalactic UV background on or off (required)
  redshift: -1                                  # Redshift of the UV background, -1 follows the simulation time (required)
  with_metal_cooling: 1                         # Metal cooling on or off (required)
  thermal_time_myr: 0                           # Adiabatic-cooling time in Myr after a feedback event (required)
  maximal_density_Hpcm3: 1e4                    # Cooling density ceiling in H atoms/cm^3, a value < 0 disables it (required)
  max_steps: 10000                              # Maximal Grackle sub-cycle iterations per particle solve (Default: 10000)
  subcycle_on_failure: 2                        # Retries of a failed solve, each halving the sub-step, in [0, 20] (Default: 2)
  cmb_temperature_floor: 1                      # Grackle's internal CMB temperature floor on or off (Default: 1)
  agora_cmb_temperature_floor: 0                # AGORA redshift-dependent CMB floor T_CMB,0 (1+z) applied by SWIFT (Default: 0)
  HydrogenFractionByMass: 0.76                  # Hydrogen mass fraction (Default: 0.76)

  # Self-shielding.
  self_shielding_method: -1                     # Continuum self-shielding: -1 GEAR, 0 none, 1 to 3 Grackle (Default: 0)
  self_shielding_threshold_atom_per_cm3: 0.007  # Density threshold in H atoms/cm^3, required with self_shielding_method -1

  # Chemistry network: initial abundances as number ratios to nH, -1 keeps the default.
  initial_nHII_to_nH_ratio: -1                  # nHII / nH (Default: -1)
  initial_nHeI_to_nH_ratio: -1                  # nHeI / nH (Default: -1)
  initial_nHeII_to_nH_ratio: -1                 # nHeII / nH (Default: -1)
  initial_nHeIII_to_nH_ratio: -1                # nHeIII / nH (Default: -1)

  # Radiation field and RT rates (cgs).
  use_radiative_transfer: 0                     # Ionization and heating rates are provided; forced on by HII_couple_ionization_rate, and by the ISRF in grackle_2 and grackle_3 builds (Default: 0)
  RT_heating_rate_cgs: 0                        # Heating rate per nHI, cgs (Default: 0)
  RT_HI_ionization_rate_cgs: 0                  # HI ionization rate [1/s] (Default: 0)
  RT_HeI_ionization_rate_cgs: 0                 # HeI ionization rate [1/s] (Default: 0)
  RT_HeII_ionization_rate_cgs: 0                # HeII ionization rate [1/s] (Default: 0)

  # Constant heating rates.
  volumetric_heating_rates_cgs: 0               # Constant volumetric heating rate [erg/s/cm3] (Default: 0)
  specific_heating_rates_cgs: 0                 # Constant specific heating rate [erg/s/g] (Default: 0)

  # Debug.
  disable_cooling_for_debugging: 0              # Debug only: skip the per-particle cooling update, cooling_init() still runs (Default: 0)

GEARChemistry:
  # Solar (Z/Zsun=1), not the Z=0 the other StromgrenSphere* examples use --
  # this test needs a non-negligible IR opacity kappa_IR=10 cm^2/g*(Z/Zsun)
  # (Eq. rp-tauIR) to actually exercise the (1+tau_IR) term (see README).
  initial_metallicity: 1
  scale_initial_metallicity: 1
  diffusion_coefficient: 1e-3  # Coefficient for the diffusion (see Shen et al. 2010; differs by gamma^2 due to h^2). (Default: 1e-3)

GEARFeedback:
  # Stellar evolution
  yields_table: radiation_fits_popII.hdf5                                  # Stellar yields table filename
  yields_table_first_stars: radiation_fits_popII.hdf5                      # First-star (Pop III) yields table
  imf_transition_metallicity: -5                            # Pop III/II IMF cutoff, [Fe/H] (default)
  discrete_yields: 1                                        # Use discrete stellar yields
  elements: [Fe, Mg, O, C, Al, Ca, Ba, Zn, Eu]              # Chemical elements read from yields table
  discrete_star_minimal_gravity_mass_Msun: 0.1
  dt_evolution_factor_max: 300                              # Young-SSP timestep refinement factor (default)
  event_dt_floor_Myr: 1e-4

  # Supernovae
  supernovae_Ia_energy_erg: 1e51
  supernovae_efficiency: 0                                  # SN energy efficiency, SNIa+SNII

  # Stellar winds
  with_stellar_wind_feedback: 0                             # Stellar wind feedback switch

  # Radiation pressure
  with_radiation_pressure: 1                                # Radiation-pressure momentum channel. The efficiency below is read only when this is 1. (Default: 0)
  radiation_pressure_efficiency: 1                          # Radiation-pressure momentum efficiency

Stars:
  timestep_age_threshold_unlimited_Myr: 11.
  timestep_age_threshold_Myr:           7.
  max_timestep_young_Myr:               0.1
  max_timestep_old_Myr:                 1
  min_star_timestep_Myr: 1e-4     # Floor (in Myr) applied to the star's final time-step, after combining the age-based bound above with the feedback module's own criteria (stellar-evolution stage, HII rebuild cadence, ...). (Default: 1e-4)
  # Photoionization is off in this example (see GEARFeedback above), so this
  # search radius is otherwise inert -- but it must still stay under the
  # box half-width, or SWIFT's startup check refuses the run (a search
  # radius the grid cannot provide triggers an endless rebuild demand).
  # 1 pc is safely under this example's box at any resolution level.
  HII_max_search_radius: 0.001
  HII_max_retry_full_buffer: 30
  HII_max_radius_expansion_tries: 5
  HII_radius_expansion_factor: 1.1
  overwrite_birth_time: 0         # Overwrite the birth time of stars read from the ICs? (Default: 0)
  birth_time: -1                  # Birth time used for all stars if overwrite_birth_time is 1 (-1 means the stars remain inactive feedback-wise throughout the run).
  overwrite_birth_density: 0      # Overwrite the birth density of stars read from the ICs? (Default: 0)
  birth_density: -1               # Birth density used for all stars if overwrite_birth_density is 1.
  overwrite_birth_temperature: 0  # Overwrite the birth temperature of stars read from the ICs? (Default: 0)
  birth_temperature: -1           # Birth temperature used for all stars if overwrite_birth_temperature is 1.
