# Define the system of units to use internally.
InternalUnitSystem:
  UnitMass_in_cgs:     1.988409870698051e+43   # 10^10 solar masses
  UnitLength_in_cgs:   3.0856775814913673e+21  # 1 kpc
  UnitVelocity_in_cgs: 1e5                     # km/s
  UnitCurrent_in_cgs:  1                       # Amperes
  UnitTemp_in_cgs:     1                       # Kelvin

Restarts:
  enable: 0

# No Potential: block -- --external-gravity (run.sh) is a no-op force,
# matching the sibling ISRF examples' idiom.
Gravity:
  MAC:                           adaptive
  epsilon_fmm:                   0.001
  theta_cr:                      0.7
  eta:          0.025
  max_physical_baryon_softening: 0.005
  mesh_side_length:        32

# Overridden per run by run.sh -- these are placeholders.
TimeIntegration:
  time_begin:        0.
  time_end:          5e-4
  dt_min:            1e-14
  dt_max:            1e-4

Snapshots:
  subdir: snap
  basename:   snapshot
  time_first: 0.0
  delta_time: 5e-5
  recording_triggers_sink:   [-1, -1, -1]
  compression: 9

Scheduler:
  cell_extra_gparts: 10
  cell_extra_sinks:  10
  cell_extra_sparts: 10
  max_top_level_cells: 3
  tasks_per_cell: 150

Statistics:
  delta_time:           1e-5
  time_first:             0.

# Parameters related to the initial conditions
InitialConditions:
  file_name:          ICs_isrf_multibin_dissipation.hdf5
  periodic:                 1
  shift:              [0.0, 0.0, 0.0]

# Parameters for the hydrodynamics scheme
SPH:
  resolution_eta:        1.2348
  CFL_condition:         0.1
  minimal_temperature:   1
  # Required: without this, every particle's InternalEnergy is overwritten
  # uniformly at startup and the two-phase temperature split (hence the
  # timestep-bin split) collapses. run.sh hardcodes the matching -P.
  initial_temperature:   0

GEARChemistry:
  # Solar (Z/Zsun=1): kappa_eff/D(Z) (and hence lambda) is only meaningful
  # for a nonzero, known metallicity. This example is star-sourced, like
  # ISRFCausalReach/ISRFDissipation.
  initial_metallicity: 1
  scale_initial_metallicity: 1
  diffusion_coefficient: 1e-3

GrackleCooling:
  cloudy_table: CloudyData_UVB=HM2012.h5        # Name of the Cloudy Table (available on the grackle bitbucket repository)
  with_UV_background: 0                         # Enable or not the UV background
  redshift: -1                                  # Redshift to use (-1 means time based redshift)
  with_metal_cooling: 1                         # Enable or not the metal cooling
  self_shielding_method: -1                     # Grackle (<= 3) or Gear self shielding method
  self_shielding_threshold_atom_per_cm3: 0.007  # Required only with GEAR's self shielding. Density threshold of the self shielding
  max_steps: 1000
  convergence_limit: 1e-2
  thermal_time_myr: 0
  maximal_density_Hpcm3: 1e4                    # Maximal density (in hydrogen atoms/cm^3) for cooling. Higher densities are floored to this value. A value < 0 deactivates this parameter.
  HydrogenFractionByMass: 0.76                  # Hydrogen fraction by mass. (Default: 0.76)
  use_radiative_transfer: 0                     # Arrays of ionization/heating rates are provided. (Default: 0)
  cmb_temperature_floor: 1                      # Enable/disable an effective CMB temperature floor. (Default: 1)
  RT_heating_rate_cgs: 0
  RT_HI_ionization_rate_cgs: 0
  RT_HeI_ionization_rate_cgs: 0
  RT_HeII_ionization_rate_cgs: 0
  volumetric_heating_rates_cgs: 0
  specific_heating_rates_cgs: 0
  # local_dust_to_gas_ratio left unset: resolves to Grackle's own compiled
  # default.
  #
  # Required, not optional: without this, the temperature contrast that
  # sets the two-phase timestep-bin split would cool away.
  disable_cooling_for_debugging: 1

GEARFeedback:
  supernovae_Ia_energy_erg: 1e51
  supernovae_efficiency: 0
  with_stellar_wind_feedback: 0
  stellar_winds_efficiency: 1.0
  discrete_star_minimal_gravity_mass_Msun: 0.1
  yields_table: POPIIsw.h5
  yields_table_first_stars: POPIIsw.h5
  discrete_yields: 1
  imf_transition_metallicity: -5
  elements: [Fe, Mg, O, C, Al, Ca, Ba, Zn, Eu]

  # Radiation -- photoionization and radiation pressure both off: isolates
  # the LW/FUV propagation and dissipation channel this example measures.
  with_photoelectric_heating:    1
  LW_FUV_propagation:            1
  LW_FUV_c_hyp_margin:           0.5
  # Debug-only pins, inert at these values; must never be nonzero in a
  # production run. run.sh overrides LW_FUV_c_hyp_pin_for_debugging for the
  # mechanism-control leg only.
  LW_FUV_c_hyp_pin_for_debugging: 0
  LW_FUV_dissipation_alpha_pin_for_debugging: 0
  # Stage-1 triggered artificial-dissipation term, at its shipped default.
  # run.sh overrides this per leg (0.25 for the test, 0 for the
  # attribution twin).
  LW_FUV_dissipation_alpha_max:  0.25
  with_photoionization:          0
  radiation_pressure_efficiency: 0
  HII_rebuild_time_Myr:   0.5

Stars:
  timestep_age_threshold_unlimited_Myr: 11.
  timestep_age_threshold_Myr:           7.
  # Overridden low (see README): the family default (0.1 Myr) is ~9x the
  # cold-phase gas step, which would make the star inject impulsively once
  # per 9 gas steps instead of every gas step.
  max_timestep_young_Myr:               0.005
  max_timestep_old_Myr:                 1
  min_star_timestep_Myr: 1e-4
  # Photoionization is off in this example, so this search radius is
  # otherwise inert -- but it must still stay under the box half-width.
  HII_max_search_radius: 0.001
  HII_max_retry_full_buffer: 30
  HII_max_radius_expansion_tries: 5
  HII_radius_expansion_factor: 1.1
  overwrite_birth_time: 0
  birth_time: -1
  overwrite_birth_density: 0
  birth_density: -1
  overwrite_birth_temperature: 0
  birth_temperature: -1
