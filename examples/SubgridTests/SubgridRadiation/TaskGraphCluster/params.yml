# Define the system of units to use internally.
InternalUnitSystem:
  UnitMass_in_cgs:     1.988409870698051e+43   # 10^10 solar masses 
  UnitLength_in_cgs:   3.0856775814913673e+21  # 1 kpc 
  UnitVelocity_in_cgs: 1e5                     # km/s
  UnitCurrent_in_cgs:  1                       # Amperes
  UnitTemp_in_cgs:     1                       # Kelvin

Restarts:
  enable: 1
  delta_hours: 0.1
  resubmit_on_exit: 0

# Parameters for the self-gravity scheme
Gravity:
  MAC:                           adaptive  # Choice of mulitpole acceptance criterion: 'adaptive' OR 'geometric'.
  epsilon_fmm:                   0.001     # Tolerance parameter for the adaptive multipole acceptance criterion.
  theta_cr:                      0.7       # Opening angle for the purely gemoetric criterion.
  eta:          0.025                      # Constant dimensionless multiplier for time integration.
  max_physical_baryon_softening: 0.005     # Physical softening length (in internal units)
  mesh_side_length:        32

# Parameters governing the time integration (Set dt_min and dt_max to the same value for a fixed time-step run.)
TimeIntegration:
  time_begin:        0.     # The starting time of the simulation (in internal units).
  time_end:          5e-2   # The end time of the simulation (in internal units, ~49 Myr -- long enough for
                            # the 7 individual HII regions to grow and merge into one bubble, short of
                            # HII_max_age_Myr).
  dt_min:            1e-10  # The minimal time-step size of the simulation (in internal units).
  dt_max:            1e-2   # The maximal time-step size of the simulation (in internal units).

# Parameters governing the snapshots
Snapshots:
  subdir: snap
  basename:   snapshot                     # Common part of the name of output files
  time_first: 0.0                          # (Optional) Time of the first output if non-cosmological time-integration (in internal units)
  delta_time: 2e-3                         # Time difference between consecutive outputs (in internal units)
  recording_triggers_sink:   [-1, -1, -1]  # Recording starts 10M, 1M and 0.1M years before a snapshot
  compression: 9                           # Lossless HDF5 gzip compression to save disk space

Scheduler:
  cell_extra_gparts: 10   # (Optional) Number of spare sparts per top-level allocated at rebuild time for on-the-fly creation.
  cell_extra_sinks:  10   # (Optional) Number of spare sparts per top-level allocated at rebuild time for on-the-fly creation.
  cell_extra_sparts: 10   # (Optional) Number of spare sparts per top-level allocated at rebuild time for on-the-fly creation.
  max_top_level_cells: 3  # Cell width = boxsize/3 = 0.08 kpc. makeIC_cluster.py places 7 stars at the
                          # center cell and its 6 face-adjacent cells -- keep this in sync with
                          # makeIC_cluster.py's --n_cells (must stay 3 for that placement pattern).
  tasks_per_cell: 100

# Parameters governing the conserved quantities statistics
Statistics:
  delta_time:           1e-3  # Time between statistics output
  time_first:             0.  # (Optional) Time of the first stats output if non-cosmological time-integration (in internal units)

# Parameters related to the initial conditions
InitialConditions:
  file_name:          ICs_stromgren_cluster.hdf5
  periodic:                 1  # Are we running with periodic ICs?
  shift:              [0.0, 0.0, 0.0]

# Parameters for the hydrodynamics scheme
SPH:
  resolution_eta:        1.2348  # Target smoothing length in units of the mean inter-particle separation (1.2348 == 57Ngbs with the Wendland C2 kernel).
  CFL_condition:         0.1     # Courant-Friedrich-Levy condition for time integration.
  minimal_temperature:   1
  initial_temperature:   10

# Cooling with Grackle 3.0
GrackleCooling:
  cloudy_table: CloudyData_UVB=HM2012.h5        # Name of the Cloudy Table (available on the grackle bitbucket repository)
  with_UV_background: 0                         # Enable or not the UV background
  redshift: -1                                  # Redshift to use (-1 means time based redshift)
  with_metal_cooling: 1                         # Enable or not the metal cooling
  self_shielding_method: -1                     # Grackle (<= 3) or Gear self shielding method
  self_shielding_threshold_atom_per_cm3: 0.007  # Required only with GEAR's self shielding. Density threshold of the self shielding
  max_steps: 1000
  convergence_limit: 1e-2
  thermal_time_myr: 0
  maximal_density_Hpcm3: 1e4                    # Maximal density (in hydrogen atoms/cm^3) for cooling. Higher densities are floored to this value to ensure grackle works properly when interpolating beyond the cloudy_table maximal density. A value < 0 deactivates
                                                # this parameter.
  HydrogenFractionByMass: 0.76                  # Hydrogen fraction by mass. (Default: 0.76)
  use_radiative_transfer: 0                     # Arrays of ionization/heating rates are provided. (Default: 0)
  cmb_temperature_floor: 1                      # Enable/disable an effective CMB temperature floor. (Default: 1)
  RT_heating_rate_cgs: 0                        # Heating rate in units of / nHI_cgs. (Default: 0)
  RT_HI_ionization_rate_cgs: 0                  # HI ionization rate in cgs [1/s]. (Default: 0)
  RT_HeI_ionization_rate_cgs: 0                 # HeI ionization rate in cgs [1/s]. (Default: 0)
  RT_HeII_ionization_rate_cgs: 0                # HeII ionization rate in cgs [1/s]. (Default: 0)
  volumetric_heating_rates_cgs: 0               # Volumetric heating rate in cgs [erg/s/cm3]. (Default: 0)
  specific_heating_rates_cgs: 0                 # Specific heating rate in cgs [erg/s/g]. (Default: 0)
  initial_nHII_to_nH_ratio: -1                  # Initial nHII to nH ratio (number density ratio). Ignored if -1. (Default: -1)
  initial_nHeI_to_nH_ratio: -1                  # Initial nHeI to nH ratio (number density ratio). Ignored if -1. (Default: -1)
  initial_nHeII_to_nH_ratio: -1                 # Initial nHeII to nH ratio (number density ratio). Ignored if -1. (Default: -1)
  initial_nHeIII_to_nH_ratio: -1                # Initial nHeIII to nH ratio (number density ratio). Ignored if -1. (Default: -1)

GEARChemistry:
  initial_metallicity: 0
  scale_initial_metallicity: 1
  diffusion_coefficient: 1e-3  # Coefficient for the diffusion (see Shen et al. 2010; differs by gamma^2 due to h^2). (Default: 1e-3)

GEARFeedback:
  supernovae_Ia_energy_erg: 1e51                # supernovae energy, used only for SNIa
  supernovae_efficiency: 0                      # supernovae energy efficiency, used for both SNIa and SNII
  with_stellar_wind_feedback: 0
  stellar_winds_efficiency: 1.0                 # Stellar winds energy efficiency. (Default: 1.0)
  discrete_star_minimal_gravity_mass_Msun: 0.1  # Minimal gravity mass after a discrete star completely explodes, in Msun. (Default: 0.1)
  yields_table: POPIIsw.h5
  yields_table_first_stars: POPIIsw.h5
  discrete_yields: 1
  imf_transition_metallicity: -5                # Maximal metallicity ([Fe/H]) for a first star (0 to deactivate).
  elements: [Fe, Mg, O, C, Al, Ca, Ba, Zn, Eu]  # Elements to read in the yields table.

  # Radiation
  with_photoelectric_heating:    0          # Whether to run with the subgrid photoelectric heating model to mimick Strömgren sphere.
  with_photoionization:          1          # Whether to run with the subgrid photoionization model to mimick Strömgren sphere.
  HII_min_density_Hpcm3: 0.01               # Minimal density to consider a particle eligible for HII ionization (in hydrogen atoms/cm^3). The Default:1 value is tuned to exclude diffuse, non-HI-bound gas in cosmological runs; this idealized single-cloud
                                            # test evacuates its own ionized region down to ~0.1-1 H/cm^3, which self-quenches the region against that default.
  radiation_pressure_efficiency: 0          # Radiation pressure efficiency to boost the radiation pressure momentum injection. (Default: 0.0)
  HII_max_age_Myr:        50.0              # Age (in Myr) at which stars stop doing HII ionization. This is particularly relevant for the SSP star particles. (Default: 50)
  HII_rebuild_time_Myr:   0.5               # Time between rebuilding the HII region (in Myr). This values also enforce a timestep constraint on the stars. Negative values will not impose any specific rebuild time. (Default: 0.5)
  HII_rebuild_floor_Myr: 1e-4               # Minimum allowed rebuild interval (in Myr). Floors the elapsed interval the per-pass photon budget is integrated over. (Default: 1e-4)
  HII_angular_nside:             0          # Angular (HEALPix) splitting of the HII ionization budget: 0 = spherical (disabled, one shared budget), 1 = 12 HEALPix pixels. (Default: 0)
  HII_deterministic_boundary_ionization: 0  # How to treat the one gas particle a star's remaining budget can't fully ionize: 0 = probabilistic (weighted coin flip, unbiased in expectation), 1 = deterministic (always ionize it). (Default: 0)
  HII_couple_ionization_rate: 0             # Rate-couple HII photoionization into Grackle's own RT fields instead of the instant flag-and-floor scheme. Requires COOLING_GRACKLE_MODE >= 1. (Default: 0)

Stars:
  timestep_age_threshold_unlimited_Myr: 11.  # (Optional) Age above which sinks have no time-step restriction any more (in Mega-years). Defaults to 0.
  timestep_age_threshold_Myr:           7.   # (Optional) Age at which sink switch from young to old for time-stepping purposes (in Mega-years). Defaults to FLT_MAX.
  max_timestep_young_Myr:               0.5  # (Optional) Maximal time-step length of young sinks (in Mega-years). Defaults to FLT_MAX.
  max_timestep_old_Myr:                 1    # (Optional) Maximal time-step length of old sinks (in Mega-years). Defaults to FLT_MAX.
  min_star_timestep_Myr: 1e-4                # Floor (in Myr) applied to the star's final time-step, after combining the age-based bound above with the feedback module's own criteria (stellar-evolution stage, HII rebuild cadence, ...). (Default: 1e-4)
  HII_max_search_radius: 0.1                 # Maximal search radius for the Fire-like HII ionization algorithm (in internal units).
  HII_max_retry_full_buffer: 30              # Number of full-buffer retries (at a fixed search radius) allowed per HII search pass, before giving up. Increased from the default (10): at gas_mass=0.01 resolution, a single new shell of gas can hold
                                             # several thousand particles -- far more than one pass of the (compile-time) neighbour buffer can hold -- so more retries are needed to actually cover it. (Default: 10)
  HII_max_radius_expansion_tries: 5          # Number of times the HII search radius is allowed to expand within a single pass. (Default: 5)
  HII_radius_expansion_factor: 1.1           # Growth factor applied to the HII search radius at each expansion try. (Default: 1.1)
  overwrite_birth_time: 0                    # Overwrite the birth time of stars read from the ICs? (Default: 0)
  birth_time: -1                             # Birth time used for all stars if overwrite_birth_time is 1 (-1 means the stars remain inactive feedback-wise throughout the run).
  overwrite_birth_density: 0                 # Overwrite the birth density of stars read from the ICs? (Default: 0)
  birth_density: -1                          # Birth density used for all stars if overwrite_birth_density is 1.
  overwrite_birth_temperature: 0             # Overwrite the birth temperature of stars read from the ICs? (Default: 0)
  birth_temperature: -1                      # Birth temperature used for all stars if overwrite_birth_temperature is 1.
