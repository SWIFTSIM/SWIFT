# Material parameters -- Tillotson aluminium

# General properties
Material:
    state_type:    2               # Base phase state: fluid=0, solid=1, variable=2

# General material strength parameters
Strength:
    shear_mod:      2.4e10     # Shear modulus (Pa)
    bulk_mod:       0          # Bulk modulus (Pa)
    T_melt:         933        # Melting temperature (K)
    rho_0:          2700       # (kg m^-3)


# Specific material-strength schemes
ArtificialStressBasisIndependent:
    transition_factor: 5

ArtificialStressCartesianComponents:
    n:             4
    epsilon:       0.2

YieldStressBenzAsphaug:
    Y_0:            200e6

YieldStressCollins:
    Y_0:            200e6
    Y_M:            200e6
    mu_i:           0
    mu_d:           0

YieldStressWeakeningThermalTanhMelt:
    xi:             1.2

YieldStressWeakeningDensityPowerLaw:
    mult_param:     0.85
    pow_param:      4

DamageTensileBenzAsphaug:
    crack_velocity_factor:  0.4    # Crack velocity as a fraction of the longitudinal wave speed

DamageShearCollins:
    brittle_to_ductile_pressure:    0
    brittle_to_plastic_pressure:    0
    plastic_strain_at_failure:      [0.01, 0.05, 0.1, 1.0]   # At zero pressure, the two transition pressures, and twice the brittle--plastic pressure
