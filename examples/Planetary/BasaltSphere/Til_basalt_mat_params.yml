# Material parameters -- Tillotson basalt

# General properties
Material:
    state_type:      1          # Base phase state: fluid=0, solid=1, variable=2
    shear_mod:       22.7e9     # Shear modulus (Pa)
    bulk_mod:        26.7e9     # Bulk modulus (Pa)
    T_melt_scheme:   0          # Melting temperature scheme: none=0, constant=1
    T_melt_constant: 0          # Melting temperature for the constant scheme (K)
    rho_0_scheme:    2          # Reference density scheme: none=0, constant=1, from_eos=2
    rho_0_constant:  2700       # Reference density for the constant scheme (kg m^-3)
    P_min_scheme:    1          # Minimum pressure scheme: none=0, constant=1, yield_envelope=2
    P_min_constant:  -3.5e9     # Minimum pressure for the constant scheme (Pa)

# Specific material-strength schemes
ArtificialStressBasisIndependent:
    transition_factor: 5

ArtificialStressCartesianComponents:
    n:             4
    epsilon:       0.2

YieldStressBenzAsphaug:
    Y_0:            3.5e9

YieldStressCollins:
    Y_0:            3.5e9
    Y_M:            3.5e9
    mu_i:           2.0
    mu_d:           0.8

YieldStressWeakeningThermalTanhMelt:
    xi:             1.2

YieldStressWeakeningDensityPowerLaw:
    mult_param:     0.85
    pow_param:      4

DamageTensileBenzAsphaug:
    crack_velocity_factor:  0.4    # Crack velocity as a fraction of the longitudinal wave speed

DamageShearCollins:
    brittle_to_ductile_pressure:    0
    brittle_to_plastic_pressure:    0
    plastic_strain_at_failure:      [0.01, 0.05, 0.1, 1.0]   # At zero pressure, the two transition pressures, and twice the brittle--plastic pressure
