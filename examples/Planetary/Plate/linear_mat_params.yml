# Material parameters -- linear EoS

# General properties
Material:
    state_type:    1               # Base phase state: fluid=0, solid=1, variable=2

# General material strength parameters
Strength:
    shear_mod:      7.15e5     # Shear modulus (Pa)
    bulk_mod:       0               # Bulk modulus (Pa)
    T_melt:         0               # Melting temperature (K)
    rho_0:          1000            # (kg m^-3)


# Specific material-strength schemes
ArtificialStress:
    n:             4
    epsilon:       0.2
    transition_factor: 5
    
YieldStress:
    Y_0:            0
    Y_M:            0
    mu_i:           0
    mu_d:           0
    yield_weakening_thermal_xi:          0
    yield_weakening_density_mult_param:  0
    yield_weakening_density_pow_param:   0

DamageTensileBenzAsphaug:
    crack_velocity_factor:  0.4    # Crack velocity as a fraction of the longitudinal wave speed

DamageShearCollins:
    brittle_to_ductile_pressure:    0
    brittle_to_plastic_pressure:    0
    plastic_strain_at_failure:      [0.01, 0.05, 0.1, 1.0]   # At zero pressure, the two transition pressures, and twice the brittle--plastic pressure
