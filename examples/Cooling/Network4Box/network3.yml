# Define the system of units to use internally.
InternalUnitSystem:
  UnitMass_in_cgs:     2.0e33     # Solar masses
  UnitLength_in_cgs:   3.0857e21  # Kiloparsecs
  UnitVelocity_in_cgs: 1.0e5      # Kilometers per second
  UnitCurrent_in_cgs:  1          # Amperes
  UnitTemp_in_cgs:     1          # Kelvin

# Parameters governing the time integration
TimeIntegration:
  time_begin: 0.        # The starting time of the simulation (in internal units).
  time_end:   2.13e-3   # One free-fall time at n_H = 464 cm^-3, about 2.1 Myr
  dt_min:     1e-9      # The minimal time-step size of the simulation (in internal units).
  dt_max:     2.080078125e-6 # One 1024th of the run: SWIFT applies the cooling once per step

# Parameters governing the snapshots
Snapshots:
  basename:            network3     # Common part of the name of output files
  time_first:          0.           # Time of the first output (in internal units)
  delta_time:          2.13e-3      # Time difference between consecutive outputs (in internal units)

# Parameters governing the conserved quantities statistics
Statistics:
  delta_time:          2.13e-3 # Time between statistics output

Scheduler:
  max_top_level_cells: 8
  tasks_per_cell:      64

# Parameters for the hydrodynamics scheme
SPH:
  resolution_eta:        1.2348   # Target smoothing length in units of the mean inter-particle separation
  CFL_condition:         0.1      # Courant-Friedrich-Levy condition for time integration.
  minimal_temperature:   10.      # Kelvin

# Parameters related to the initial conditions
InitialConditions:
  file_name:  ./primordialBox.hdf5 # The file to read
  periodic:   1

# Cooling with geajay: the network with D and HD, and cosmic rays
GeajayCooling:
  dust_to_gas_model: linear                      # Dust-to-gas ratio model (required): linear or remy_ruyer_2014
  cloudy_table_file: CloudyData_UVB=HM2012.h5  # Name of the Cloudy table (not read here: no metals, no UV background)
  primordial_chemistry_network: H_He_H2_D        # H, He, H2, D and HD
  with_uv_background: 0                          # No UV background
  redshift: 20                                   # Redshift of the CMB
  with_metal_cooling: 0                          # No metal cooling
  thermal_time_myr: 5                            # Time (in Myr) for adiabatic cooling after a feedback event.
  solver: 1                                      # Accurate (BDF) solver
  accurate_relative_tolerance: 1e-6              # Relative tolerance of the accurate solver
  accurate_absolute_tolerance: 1e-18             # Absolute tolerance of the accurate solver
  h2_three_body_fit: Palla+1983                  # H2 three-body formation rate
  h2_cie_cooling: Ripamonti+Abel2004             # H2 collision-induced emission cooling
  case_b_recombination: B                        # Recombination case B
  initial_hii_to_h_ratio: 2e-4                   # Initial nHII to nH ratio (number)
  initial_h2i_to_h_ratio: 5e-7                   # Initial nH2I to nH ratio (number)
  deuterium_to_hydrogen_mass_ratio: 6.8e-5       # Total D to H mass ratio, the library value
  initial_di_to_h_ratio: 3.39932e-5              # Initial nDI to nH ratio (number): 3.4e-5 x (1 - x(HII))
  initial_dii_to_h_ratio: 6.8e-9                 # Initial nDII to nH ratio (number): 3.4e-5 x x(HII)
  cosmic_rays: reduced                           # The reduced cosmic-ray network
  cosmic_ray_input: constant                     # The same rate for every particle
  cosmic_ray_constant_rate: 1e-17                # Primary ionisation rate per H [s^-1]
