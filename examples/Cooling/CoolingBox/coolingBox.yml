# Define the system of units to use internally. 
InternalUnitSystem:
  UnitMass_in_cgs:     2.0e33     # Solar masses
  UnitLength_in_cgs:   3.0857e21  # Kiloparsecs
  UnitVelocity_in_cgs: 1.0e5      # Kilometers per second
  UnitCurrent_in_cgs:  1          # Amperes
  UnitTemp_in_cgs:     1          # Kelvin

# Parameters governing the time integration
TimeIntegration:
  time_begin: 0.    # The starting time of the simulation (in internal units).
  time_end:   0.25  # The end time of the simulation (in internal units).
  dt_min:     1e-5  # The minimal time-step size of the simulation (in internal units).
  dt_max:     1e-2  # The maximal time-step size of the simulation (in internal units).

# Parameters governing the snapshots
Snapshots:
  basename:            coolingBox # Common part of the name of output files
  time_first:          0.         # Time of the first output (in internal units)
  delta_time:          1e-2       # Time difference between consecutive outputs (in internal units)

# Parameters governing the conserved quantities statistics
Statistics:
  delta_time:          1e-3 # Time between statistics output

Scheduler:
  tasks_per_cell: 64

# Parameters for the hydrodynamics scheme
SPH:
  resolution_eta:        1.2348   # Target smoothing length in units of the mean inter-particle separation (1.2348 == 48Ngbs with the cubic spline kernel).
  CFL_condition:         0.1      # Courant-Friedrich-Levy condition for time integration.
  minimal_temperature: 100.       # Kelvin
  
# Parameters related to the initial conditions
InitialConditions:
  file_name:  ./coolingBox.hdf5     # The file to read
  periodic:   1
  
# Dimensionless pre-factor for the time-step condition
LambdaCooling:
  lambda_nH2_cgs:              1e-22 # Cooling rate divided by square Hydrogen number density (in cgs units [erg * s^-1 * cm^3])
  cooling_tstep_mult:          1.0        # Dimensionless pre-factor for the time-step condition

# Cooling with Grackle 3.0
GrackleCooling:
  # Core Grackle settings. Each optional key states its parser default.
  cloudy_table: CloudyData_UVB=HM2012.h5        # Cloudy table file (required)
  with_UV_background: 0                         # Metagalactic UV background on or off (required)
  redshift: 0                                   # Redshift of the UV background, -1 follows the simulation time (required)
  with_metal_cooling: 1                         # Metal cooling on or off (required)
  thermal_time_myr: 5                           # Adiabatic-cooling time in Myr after a feedback event (required)
  maximal_density_Hpcm3: -1                     # Cooling density ceiling in H atoms/cm^3, a value < 0 disables it (required)
  max_steps: 10000                              # Maximal Grackle sub-cycle iterations per particle solve (Default: 10000)
  subcycle_on_failure: 2                        # Retries of a failed solve, each halving the sub-step, in [0, 20] (Default: 2)
  cmb_temperature_floor: 1                      # Grackle's internal CMB temperature floor on or off (Default: 1)
  agora_cmb_temperature_floor: 0                # AGORA redshift-dependent CMB floor T_CMB,0 (1+z) applied by SWIFT (Default: 0)
  HydrogenFractionByMass: 0.76                  # Hydrogen mass fraction (Default: 0.76)

  # H2 and self-shielding. The ISRF needs H2_self_shielding 2 or 3 with primordial_chemistry >= 2,
  # otherwise the Lyman-Werner field reaches Grackle unshielded.
  H2_self_shielding: 0                          # 0 off, 2 column set by H2_self_shielding_path, 3 local Jeans length (1 is rejected) (Default: 0)
  H2_self_shielding_path: kernel_radius         # Mode 2 only: column path kernel_radius or kernel_diameter (Default: kernel_radius)
  H2_on_dust: 0                                 # H2 formation on dust grains (Default: 0)
  H2_photodissociation_heating: 0               # Heating per H2 photodissociation, needs mode >= 2 and a Grackle that provides it (Default: 0)
  H2_three_body_rate: 0                         # H2 three-body formation rate model, 0 to 5 (Grackle documentation) (Default: 0)
  H2_cie_cooling: 0                             # H2 collision-induced emission cooling (Ripamonti & Abel 2004) (Default: 0)
  self_shielding_method: 0                      # Continuum self-shielding: -1 GEAR, 0 none, 1 to 3 Grackle (Default: 0)
  self_shielding_threshold_atom_per_cm3: 0.007  # Density threshold in H atoms/cm^3, required with self_shielding_method -1

  # Chemistry network: initial abundances as number ratios to nH, -1 keeps the default.
  initial_nHII_to_nH_ratio: -1                  # nHII / nH (Default: -1)
  initial_nHeI_to_nH_ratio: -1                  # nHeI / nH (Default: -1)
  initial_nHeII_to_nH_ratio: -1                 # nHeII / nH (Default: -1)
  initial_nHeIII_to_nH_ratio: -1                # nHeIII / nH (Default: -1)
  initial_nHM_to_nH_ratio: -1                   # nHM / nH (Default: -1)
  initial_nH2I_to_nH_ratio: -1                  # nH2I / nH (Default: -1)
  initial_nH2II_to_nH_ratio: -1                 # nH2II / nH (Default: -1)
  initial_nDI_to_nH_ratio: -1                   # nDI / nH (Default: -1)
  initial_nDII_to_nH_ratio: -1                  # nDII / nH (Default: -1)
  initial_nHDI_to_nH_ratio: -1                  # nHDI / nH (Default: -1)

  # Radiation field and RT rates (cgs).
  use_radiative_transfer: 0                     # Ionization and heating rates are provided; forced on by HII_couple_ionization_rate, and by the ISRF in grackle_2 and grackle_3 builds (Default: 0)
  RT_heating_rate_cgs: 0                        # Heating rate per nHI, cgs (Default: 0)
  RT_HI_ionization_rate_cgs: 0                  # HI ionization rate [1/s] (Default: 0)
  RT_HeI_ionization_rate_cgs: 0                 # HeI ionization rate [1/s] (Default: 0)
  RT_HeII_ionization_rate_cgs: 0                # HeII ionization rate [1/s] (Default: 0)
  RT_H2_dissociation_rate_cgs: 0                # H2 dissociation rate [1/s], keep 0 when the ISRF supplies it (Default: 0)

  # Constant heating rates.
  volumetric_heating_rates_cgs: 0               # Constant volumetric heating rate [erg/s/cm3] (Default: 0)
  specific_heating_rates_cgs: 0                 # Constant specific heating rate [erg/s/g] (Default: 0)

  # Debug.
  disable_cooling_for_debugging: 0              # Debug only: skip the per-particle cooling update, cooling_init() still runs (Default: 0)

GEARChemistry:
  initial_metallicity: 0.01295

EAGLECooling:
  dir_name:                ./coolingtables/
  H_reion_z:               11.5
  H_reion_eV_p_H:          2.0
  He_reion_z_centre:       3.5
  He_reion_z_sigma:        0.5
  He_reion_eV_p_H:         2.0

EAGLEChemistry:             # Solar abundances
  init_abundance_metal:     0.014
  init_abundance_Hydrogen:  0.70649785
  init_abundance_Helium:    0.28055534
  init_abundance_Carbon:    2.0665436e-3
  init_abundance_Nitrogen:  8.3562563e-4
  init_abundance_Oxygen:    5.4926244e-3
  init_abundance_Neon:      1.4144605e-3
  init_abundance_Magnesium: 5.907064e-4
  init_abundance_Silicon:   6.825874e-4
  init_abundance_Iron:      1.1032152e-3

GEARPressureFloor:
  jeans_factor: 0.       # Number of particles required to suppose a resolved clump and avoid the pressure floor.

PS2020Cooling:
  dir_name:                ./UV_dust1_CR1_G1_shield1.hdf5 # Location of the cooling tables
  H_reion_z:               7.5               # Redshift of Hydrogen re-ionization (Planck 2018)
  H_reion_eV_p_H:          2.0
  He_reion_z_centre:       3.5               # Redshift of the centre of the Helium re-ionization Gaussian
  He_reion_z_sigma:        0.5               # Spread in redshift of the  Helium re-ionization Gaussian
  He_reion_eV_p_H:         2.0               # Energy inject by Helium re-ionization in electron-volt per Hydrogen atom
  delta_logTEOS_subgrid_properties: 0.3      # delta log T above the EOS below which the subgrid properties use Teq assumption
  rapid_cooling_threshold:          0.333333 # Switch to rapid cooling regime for dt / t_cool above this threshold.
