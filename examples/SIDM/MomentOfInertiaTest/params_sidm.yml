# Define the system of units to use internally.
InternalUnitSystem:
  UnitMass_in_cgs:     1.98841e43    # 10^10 M_sun in grams
  UnitLength_in_cgs:   3.08567758e24 # Mpc in centimeters
  UnitVelocity_in_cgs: 1e5           # km/s in centimeters per second
  UnitCurrent_in_cgs:  1             # Amperes
  UnitTemp_in_cgs:     1             # Kelvin

# Parameters governing the time integration
TimeIntegration:
  time_begin:          0.      # The starting time of the simulation (in internal units).
  time_end:            1e-5    # The end time of the simulation (in internal units).
  dt_min:              1e-10   # The minimal time-step size of the simulation (in internal units).
  dt_max:              1e-5    # The maximal time-step size of the simulation (in internal units).

# Parameters for the self-gravity scheme
Gravity:
  eta:                           0.025     # Constant dimensionless multiplier for time integration.
  MAC:                           adaptive  # Choice of mulitpole acceptance criterion: 'adaptive' OR 'geometric'.
  epsilon_fmm:                   0.001     # Tolerance parameter for the adaptive multipole acceptance criterion.
  theta_cr:                      0.7       # Opening angle for the purely gemoetric criterion.
  mesh_side_length:              256
  comoving_DM_softening:         0.0026994 # Comoving DM softening length (in internal units).
  max_physical_DM_softening:     0.0007    # Max physical DM softening length (in internal units).
  comoving_baryon_softening:     0.0026994 # Comoving baryon softening length (in internal units).
  max_physical_baryon_softening: 0.0007    # Max physical baryon softening length (in internal units).

# Parameters governing the snapshots 
Snapshots:
  subdir:              snap_sidm
  basename:            snapshot  # Common part of the name of output files
  time_first:          0.        # Time of the first output (in internal units)
  delta_time:          1e-5      # Time difference between consecutive outputs (in internal units)

# Parameters governing the conserved quantities statistics
Statistics:
  delta_time:          1e-5    # Time between statistics output

Scheduler:
  max_top_level_cells: 16
  links_per_tasks:     500

# Parameters related to the initial conditions
InitialConditions:
  file_name:                EAGLE_ICs_6_SIDM.hdf5      # The file to read
  periodic:                 1
  cleanup_h_factors:        1     # Remove the h-factors inherited from Gadget
  cleanup_velocity_factors: 1     # Remove the sqrt(a) factor in the velocities inherited from Gadget
  remap_ids:                0     # The IC IDs are unique; keep them so SIDM and gas particles can be matched on ID

# Parameters for the SIDM scheme (neighbour finding identical to SPH in params_gas.yml)
BasicSIDM:
  resolution_eta:         1.2348   # Target smoothing length in units of the mean inter-particle separation (1.2348 == 48Ngbs with the cubic spline kernel).
  h_min_ratio:            0.1      # Minimal smoothing length in units of softening.
  h_max:                  0.5      # Maximal smoothing length in co-moving internal units.
  h_tolerance:            1e-4
  max_ghost_iterations:   30
  constant_cross_section: 1
  sigma_over_m_cgs:       1
