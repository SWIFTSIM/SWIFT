MetaData:
  run_name: RT Cooling Test

# Define the system of units to use internally. 
InternalUnitSystem:
  UnitMass_in_cgs:     1.98848e23    # 10^-10 M_sun in grams
  UnitLength_in_cgs:   3.08567758e21 # 1 kpc in cm
  UnitVelocity_in_cgs: 1e5           # 1 km/s in cm/s
  UnitCurrent_in_cgs:  1             # Amperes
  UnitTemp_in_cgs:     1             # Kelvin


# Parameters governing the time integration
TimeIntegration:
  max_nr_rt_subcycles: 1
  time_begin: 0.     # The starting time of the simulation (in internal units).
  time_end:   0.100  # The end time of the simulation (in internal units).
  dt_min:     1.e-8  # The minimal time-step size of the simulation (in internal units).
  dt_max:     4.882814e-05  # The maximal time-step size of the simulation (in internal units).


# Parameters governing the snapshots
Snapshots:
  basename:            output # Common part of the name of output files
  time_first:          0.     # Time of the first output (in internal units)
  delta_time:          0.001

# Parameters governing the conserved quantities statistics
Statistics:
  time_first:          0.
  delta_time:          0.01 # Time between statistics output

# Parameters for the hydrodynamics scheme
SPH:
  resolution_eta:        1.2348   # Target smoothing length in units of the mean inter-particle separation (1.2348 == 48Ngbs with the cubic spline kernel).
  CFL_condition:         0.6      # Courant-Friedrich-Levy condition for time integration.
  minimal_temperature:   100.     # Kelvin

# Parameters related to the initial conditions
InitialConditions:
  file_name:  ./cooling_test.hdf5  # The file to read
  periodic:   1                    # periodic ICs

GEARRT:
  f_reduce_c: 1.e-9                                 # This test is without actual radiation, so we don't care about this
  CFL_condition: 0.9                                # CFL condition for RT, independent of hydro
  photon_groups_Hz: [3.288e15, 5.945e15, 13.157e15] # Lower photon frequency group bin edges in Hz. Needs to have exactly N elements, where N is the configured number of bins --with-RT=GEAR_N
  stellar_luminosity_model: const                   # Which model to use to determine the stellar luminosities.
  const_stellar_luminosities_LSol: [0., 0., 0.]     # (Conditional) constant star luminosities for each photon frequency group to use if stellar_luminosity_model:const is set, in units of Solar Luminosity.
  hydrogen_mass_fraction:   0.76                    # total hydrogen mass fraction
  stellar_spectrum_type: 0                          # Which radiation spectrum to use. 0: constant from 0 until some max frequency set by stellar_spectrum_const_max_frequency_Hz. 1: blackbody spectrum.
  stellar_spectrum_const_max_frequency_Hz: 1.e17    # (Conditional) if stellar_spectrum_type=0, use this maximal frequency for the constant spectrum. 
  case_B_recombination: 0                           # reference solution assumes case A recombination


GrackleCooling:
  # Core Grackle settings. Each optional key states its parser default.
  cloudy_table: CloudyData_UVB=HM2012.h5        # Cloudy table file (required)
  primordial_chemistry: 1                       # Species network: 0 tabulated, 1 H/He, 2 + H2, 3 + D, at most the --with-cooling=grackle_N mode (Default: the compiled grackle_N mode)
  with_UV_background: 0                         # Metagalactic UV background on or off (required)
  redshift: 0                                   # Redshift of the UV background, -1 follows the simulation time (required)
  with_metal_cooling: 0                         # Metal cooling on or off (required)
  thermal_time_myr: 5                           # Adiabatic-cooling time in Myr after a feedback event (required)
  maximal_density_Hpcm3: -1                     # Cooling density ceiling in H atoms/cm^3, a value < 0 disables it (required)
  max_steps: 10000                              # Maximal Grackle sub-cycle iterations per particle solve (Default: 10000)
  subcycle_on_failure: 2                        # Retries of a failed solve, each halving the sub-step, in [0, 20] (Default: 2)
  cmb_temperature_floor: 1                      # Grackle's internal CMB temperature floor on or off (Default: 1)
  agora_cmb_temperature_floor: 0                # AGORA redshift-dependent CMB floor T_CMB,0 (1+z) applied by SWIFT (Default: 0)
  HydrogenFractionByMass: 0.76                  # Hydrogen mass fraction (Default: 0.76)

  # Self-shielding.
  self_shielding_method: 0                      # Continuum self-shielding: -1 GEAR, 0 none, 1 to 3 Grackle (Default: 0)

  # Chemistry network: initial abundances as number ratios to nH, -1 keeps the default.
  initial_nHII_to_nH_ratio: -1                  # nHII / nH (Default: -1)
  initial_nHeI_to_nH_ratio: -1                  # nHeI / nH (Default: -1)
  initial_nHeII_to_nH_ratio: -1                 # nHeII / nH (Default: -1)
  initial_nHeIII_to_nH_ratio: -1                # nHeIII / nH (Default: -1)

  # Radiation field and RT rates (cgs).
  use_radiative_transfer: 0                     # Ionization and heating rates are provided; forced on by HII_couple_ionization_rate, and by the ISRF in grackle_2 and grackle_3 builds (Default: 0)
  RT_heating_rate_cgs: 0                        # Heating rate per nHI, cgs (Default: 0)
  RT_HI_ionization_rate_cgs: 0                  # HI ionization rate [1/s] (Default: 0)
  RT_HeI_ionization_rate_cgs: 0                 # HeI ionization rate [1/s] (Default: 0)
  RT_HeII_ionization_rate_cgs: 0                # HeII ionization rate [1/s] (Default: 0)

  # Constant heating rates.
  volumetric_heating_rates_cgs: 0               # Constant volumetric heating rate [erg/s/cm3] (Default: 0)
  specific_heating_rates_cgs: 0                 # Constant specific heating rate [erg/s/g] (Default: 0)

  # Debug.
  disable_cooling_for_debugging: 0              # Debug only: skip the per-particle cooling update, cooling_init() still runs (Default: 0)

Scheduler:
  tasks_per_cell: 128
